<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Волшебное дерево звуков</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kurale&family=Andika:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: ночное сказочное королевство — один слайд за раз в центре, звёздное небо и силуэт замка на фоне, сверху тропинка-прогресс по главам. Намеренно одна (ночная) тема. */
:root{
  color-scheme:dark;
  --night:#0B0E2E; --night2:#171A52; --plum:#2A1C5C;
  --card:rgba(22,24,74,.78); --card2:rgba(255,255,255,.07); --line:rgba(245,196,81,.32);
  --ink:#FFF8EC; --muted:#C9C6EC; --gold:#F5C451; --gold2:#FFE6A0; --parch:#FFF4DA; --parch-ink:#3A2366;
  --a:#FF7E94; --o:#FFB65C; --i:#86B6FF; --u:#C9A2FF; --e:#72E6AC; --y:#5EE3E0;
  --closed:#FF946E; --open:#7DE3C8; --silent:#F5C451;
  --ok:#72E6AC; --bad:#FF7E94;
  --title:'Kurale',Georgia,'Times New Roman',serif;
  --word:'Andika','Nunito','Segoe UI',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background:radial-gradient(1100px 600px at 75% -10%,#3D2B80 0,transparent 60%),radial-gradient(900px 520px at 5% 5%,#1C3A7E 0,transparent 60%),linear-gradient(180deg,#0B0E2E 0,#131647 55%,#25174E 100%);background-color:var(--night);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B0E2E}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.castle{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(1200px,100%);z-index:0;pointer-events:none;opacity:.55}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.c-a{--vc:var(--a)}.c-o{--vc:var(--o)}.c-i{--vc:var(--i)}.c-u{--vc:var(--u)}.c-e{--vc:var(--e)}.c-y{--vc:var(--y)}
.k-closed{--kc:var(--closed)}.k-open{--kc:var(--open)}.k-silent{--kc:var(--silent)}

/* top path */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,rgba(11,14,46,.92),rgba(11,14,46,.6));backdrop-filter:blur(8px)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.logo{font-family:var(--title);font-size:22px;color:var(--gold2);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.path{flex:1;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.path::-webkit-scrollbar{display:none}
.dot{flex:0 0 auto;width:14px;height:14px;border:0;padding:0;background:none;display:grid;place-items:center}
.dot i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:.3s}
.dot.done i{background:var(--gold)}
.dot.cur i{width:14px;height:14px;background:var(--gold2);box-shadow:0 0 12px var(--gold)}
.dot.ch{margin-left:8px}
.timer{display:none;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2);font-size:14px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer;white-space:nowrap}
body.teacher .timer{display:inline-block}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
body.teacher .tbtn{background:var(--gold);color:var(--night);border-color:var(--gold)}

/* stage */
main{position:relative;z-index:1;overflow-x:clip;max-width:1180px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slide{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:clamp(18px,3.4vw,40px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:22px;min-height:min(640px,calc(100vh - 210px));animation:enter .6s cubic-bezier(.2,.9,.3,1.1) both;position:relative}
.slide.back{animation-name:enterB}
@keyframes enter{from{opacity:.001;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:.001;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold)}
h1,h2,h3{font-family:var(--title);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.st{font-size:clamp(32px,5vw,54px);background:linear-gradient(180deg,#FFF6D8 0%,var(--gold) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(245,196,81,.15)}
h3{font-size:26px;color:var(--gold2)}
p{margin:0}
.muted{color:var(--muted)}
.grow{flex:1;display:flex;flex-direction:column;gap:20px;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.center{justify-content:center;text-align:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two,.three{grid-template-columns:minmax(0,1fr)}}

.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:17px;background:var(--card2);border:1px solid rgba(255,255,255,.14);transition:transform .12s, box-shadow .2s}
.btn:hover{box-shadow:0 0 0 1px var(--line),0 0 18px rgba(245,196,81,.18)}
.btn:active{transform:translateY(2px)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1C5C;border-color:transparent;box-shadow:0 6px 0 #B98A1E,0 10px 24px rgba(245,196,81,.25)}
.btn.gold:active{box-shadow:0 2px 0 #B98A1E}
.btn.ok{background:var(--ok);color:#10301F;border-color:transparent}.btn.bad{background:var(--bad);color:#3B0F1A;border-color:transparent}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:12px}
.say{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(245,196,81,.12);color:var(--gold2);display:inline-grid;place-items:center;flex:0 0 auto}
.say svg{width:22px;height:22px}

/* narrator */
.narr{display:flex;gap:14px;align-items:flex-end}
.narr svg{width:92px;height:110px;flex:0 0 auto;filter:drop-shadow(0 0 14px rgba(245,196,81,.35));animation:hover 4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.bubble{position:relative;background:var(--parch);color:var(--parch-ink);border-radius:22px;padding:14px 20px;font-size:19px;font-weight:600;max-width:70ch;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:var(--parch);border-left:0}
.bubble b{color:#7A2E8E}
.bubble .term{font-family:var(--title);font-size:1.08em;color:#8A3A00;background:#FFE3A3;border-radius:8px;padding:0 6px}

/* rule card (термин) */
.rule{border-radius:22px;padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--kc) 55%,transparent);box-shadow:inset 0 0 40px color-mix(in srgb,var(--kc) 10%,transparent)}
.rule .rt{font-family:var(--title);font-size:26px;color:var(--kc);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.rule .rt svg{width:34px;height:34px}
.rule p{font-size:18px}
.rule .img{color:var(--muted);font-size:16px;margin-top:8px;font-style:italic}

/* words */
.word{font-family:var(--word);font-weight:700;letter-spacing:.03em;display:inline-flex;align-items:baseline;white-space:nowrap}
.word .vw{color:var(--vc);text-shadow:0 0 18px color-mix(in srgb,var(--vc) 55%,transparent)}
.word .silent{color:var(--gold);opacity:.55;position:relative}
.word .silent::after{content:"";position:absolute;left:0;right:0;top:55%;border-top:3px solid var(--gold);transform:rotate(-14deg)}
.word .new{display:inline-block;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-60deg);opacity:0}100%{transform:none;opacity:1}}
.ipa{font-family:var(--word);white-space:nowrap}

/* demo spell */
.spell{display:grid;justify-items:center;gap:18px;text-align:center}
.spell .big{font-size:clamp(72px,14vw,140px);line-height:1.05;position:relative;padding:0 10px}
.spell .ltr{display:inline-block;position:relative;transition:transform .35s,color .35s,opacity .35s}
.spell .ltr.glow{color:var(--vc);transform:translateY(-8px) scale(1.12);text-shadow:0 0 24px var(--vc)}
.spell .ltr.guard{color:var(--closed)}
.spell .ltr.guard::before{content:"";position:absolute;left:8%;right:8%;bottom:-6px;height:8px;border-radius:4px;background:var(--closed);box-shadow:0 0 14px var(--closed)}
.spell .ltr.lockv::after{content:"";position:absolute;inset:-6px -10px -14px;border:4px solid var(--closed);border-left:0;border-radius:0 30px 30px 0;opacity:.9}
.spell .ltr.rays{color:var(--vc);text-shadow:0 0 30px var(--open),0 0 60px var(--open)}
.spell .ltr.rays::after{content:"";position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;margin:-.8em;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--open) 35%,transparent),transparent 70%);z-index:-1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.spell .empty{display:inline-block;width:.6em;height:.8em;border:4px dashed var(--open);border-radius:12px;margin-left:.08em;vertical-align:-.05em;opacity:.8}
.spell .ltr.magic{color:var(--gold);opacity:.5}
.spell .ltr.magic::before{content:"";position:absolute;left:0;right:0;top:55%;border-top:5px solid var(--gold);transform:rotate(-14deg)}
.spell .msg{font-size:21px;font-weight:700;min-height:64px;max-width:40ch}
.tag{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--kc) 22%,transparent);color:var(--kc);border:1px solid color-mix(in srgb,var(--kc) 60%,transparent)}
.spk{position:absolute;width:10px;height:10px;pointer-events:none;background:var(--gold2);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .9s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}

/* vowel cards */
.gems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.gem{perspective:900px;border:0;background:none;padding:0;height:170px}
.gem .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.gem.on .in{transform:rotateY(180deg)}
.gem .f,.gem .b{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:10px}
.gem .f{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55),transparent 40%),linear-gradient(160deg,var(--vc),color-mix(in srgb,var(--vc) 55%,#1a1050));font-family:var(--word);font-weight:700;font-size:88px;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18);box-shadow:0 0 30px color-mix(in srgb,var(--vc) 45%,transparent),inset 0 -8px 0 rgba(0,0,0,.15)}
.gem .f small{position:absolute;top:10px;font-size:12px;font-family:var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:800}
.gem .b{transform:rotateY(180deg);background:var(--parch);color:var(--parch-ink);gap:2px;font-size:15px;font-weight:700;align-content:center}
.gem .b strong{font-family:var(--title);font-size:24px;font-weight:400}
.guards{display:flex;flex-wrap:wrap;gap:8px}
.guard{width:58px;height:66px;border-radius:14px 14px 8px 8px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));display:grid;place-items:center;font-family:var(--word);font-size:28px;font-weight:700;line-height:1}
.guard small{display:none;font-size:13px;font-family:var(--body);color:var(--gold2)}
.guard.show small{display:block}
.guard.pick{background:var(--gold);color:var(--night);animation:wob .5s}
@keyframes wob{30%{transform:scale(1.15) rotate(-5deg)}60%{transform:scale(.95) rotate(4deg)}}

/* voices */
.voice{border-radius:24px;padding:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.voice .vt{font-family:var(--title);font-size:24px;color:var(--gold2)}
.voice .vipa{font-size:44px;font-family:var(--word);color:var(--vc)}
.voice .word{font-size:56px}

/* reading train */
.train{display:grid;justify-items:center;gap:16px;text-align:center}
.train .big{font-size:clamp(72px,13vw,130px);line-height:1.05}
.train .info{min-height:40px;font-size:19px;font-weight:700}
.bar5{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.bar5 i{width:26px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.bar5 i.on{background:var(--gold)}

/* sort castles */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px;padding:12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18)}
.chip{border:2px solid transparent;background:var(--parch);color:var(--parch-ink);border-radius:16px;padding:4px 16px;font-size:30px;line-height:1.25;box-shadow:0 4px 0 #CDB98A;transition:transform .15s}
.chip .word .vw{text-shadow:none;filter:brightness(.78) saturate(1.3)}
.chip.sel{transform:translateY(-6px) rotate(-3deg);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 10px 24px rgba(245,196,81,.35)}
.chip.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.castles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cst{border:1px solid color-mix(in srgb,var(--kc) 55%,transparent);border-radius:24px;background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 14%,transparent),rgba(255,255,255,.02));padding:12px;min-height:170px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:box-shadow .2s}
.cst:hover{box-shadow:0 0 24px color-mix(in srgb,var(--kc) 35%,transparent)}
.cst svg{width:70px;height:56px}
.cst .ct{font-family:var(--title);font-size:21px;color:var(--kc)}
.cst .cs{font-size:14px;color:var(--muted)}
.cst .cw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cst .cw .word{font-size:22px;background:rgba(255,255,255,.08);border-radius:10px;padding:0 10px;animation:pop .45s both}
.score{font-weight:800;font-size:16px;color:var(--muted)}
.score b{color:var(--ok)}

/* scroll / algorithm */
.scroll{background:var(--parch);color:var(--parch-ink);border-radius:20px;padding:18px 22px;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-8px;right:-8px;height:16px;border-radius:10px;background:#E7CF95}
.scroll::before{top:-8px}.scroll::after{bottom:-8px}
.scroll ol{margin:6px 0 0;padding-left:24px;display:grid;gap:8px;font-size:18px;font-weight:600}
.scroll h3{color:#7A2E8E}
.scroll .k{font-weight:800}
.scroll .k.c{color:#B4421F}.scroll .k.o{color:#13795B}.scroll .k.s{color:#9A6A00}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.isle{border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:14px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:.25s;position:relative}
.isle .L{font-family:var(--word);font-size:64px;font-weight:700;color:var(--vc);line-height:1;text-shadow:0 0 22px color-mix(in srgb,var(--vc) 50%,transparent)}
.isle .nm{font-family:var(--title);font-size:18px}
.isle small{color:var(--muted);font-size:13px}
.isle.sel{border-color:var(--vc);background:color-mix(in srgb,var(--vc) 16%,transparent);transform:translateY(-4px)}
.isle .ord{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--vc);color:var(--night);font-weight:800;display:grid;place-items:center}
.isle.done{opacity:.85}
.isle.done .ord{background:var(--gold)}

/* vowel chapter crest */
.crest{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:700px){.crest{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.shield{width:170px;height:200px;display:grid;place-items:center;font-family:var(--word);font-size:110px;font-weight:700;color:#fff;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.5),transparent 45%),linear-gradient(160deg,var(--vc),color-mix(in srgb,var(--vc) 50%,#1a1050));clip-path:path('M85 0 L170 28 L170 100 C170 160 120 190 85 200 C50 190 0 160 0 100 L0 28 Z');filter:drop-shadow(0 0 20px var(--vc));line-height:1}
.exs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.exs{grid-template-columns:minmax(0,1fr)}}
.exc{border-radius:20px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent);display:flex;flex-direction:column;gap:4px;min-width:0}
.exc h4{margin:0 0 4px;font-family:var(--title);font-weight:400;font-size:19px;color:var(--kc)}
.exc button{border:0;background:none;text-align:left;padding:0;font-size:30px}
.exc .none{font-size:14px;color:var(--muted)}
.warn{border-radius:16px;padding:10px 14px;background:rgba(245,196,81,.12);border:1px solid var(--line);font-size:16px}

/* games */
.imp{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.imp svg{width:110px;height:130px;flex:0 0 auto;animation:hover 3s ease-in-out infinite}
.imp .bubble{font-size:23px}
.imp .bubble .word{font-size:1.35em}
.fb{min-height:52px;border-radius:16px;padding:12px 16px;font-size:19px;font-weight:700;text-align:center}
.fb.ok{background:rgba(114,230,172,.14);color:var(--ok);border:1px solid rgba(114,230,172,.4)}
.fb.bad{background:rgba(255,126,148,.14);color:var(--bad);border:1px solid rgba(255,126,148,.4)}
.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;position:relative}
.mcard{border-radius:20px;height:100px;display:grid;place-items:center;font-size:40px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.mcard.gone{border:3px dashed var(--gold);background:rgba(245,196,81,.12)}
.curtain{position:absolute;inset:-8px;border-radius:24px;background:repeating-linear-gradient(90deg,#5B2A86 0 40px,#4A2170 40px 80px);transform-origin:top;transform:scaleY(0);transition:transform .6s cubic-bezier(.5,0,.3,1.2);display:grid;place-items:center;font-family:var(--title);font-size:34px;color:var(--gold2);box-shadow:inset 0 -14px 0 var(--gold)}
.curtain.down{transform:scaleY(1)}
.build{display:grid;gap:16px;justify-items:center;text-align:center}
.slots{display:flex;gap:8px}
.slot{width:66px;height:76px;border-radius:16px;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-family:var(--word);font-size:44px;font-weight:700}
.slot.full{border-style:solid;border-color:var(--gold);background:rgba(245,196,81,.1)}
.slot.v{color:var(--vc)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:66px;height:66px;border-radius:16px;border:0;background:var(--parch);color:var(--parch-ink);font-family:var(--word);font-size:38px;font-weight:700;box-shadow:0 5px 0 #CDB98A;transition:.15s}
.tile:disabled{opacity:.15;transform:scale(.85)}
.hint{font-size:22px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{border:1px solid rgba(255,255,255,.18);background:transparent;border-radius:99px;padding:8px 16px;font-weight:800;font-size:15px}
.tab.cur{background:var(--gold);color:var(--night);border-color:var(--gold)}

/* long words */
.fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.fam{border-radius:22px;padding:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px}
.fam .chunk{font-size:14px;color:var(--muted);font-weight:700}
.fam .chunk .word{font-size:22px}
.rungs{display:flex;flex-direction:column-reverse;gap:8px;min-height:150px}
.rung{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:14px;padding:4px 12px;animation:pop .45s both}
.rung .word{font-size:32px}
.rung small{font-size:13px;color:var(--muted);text-align:right}
.bossword{display:flex;align-items:center;font-size:clamp(56px,11vw,112px);line-height:1;transition:gap .6s cubic-bezier(.3,1.4,.5,1);gap:0}
.bossword.cut{gap:34px}
.bossword .part{display:flex;flex-direction:column;align-items:center;gap:10px}
.bossword .part .tag{font-size:13px;opacity:0;transition:.4s .3s}
.bossword.cut .part .tag{opacity:1}
.knife{width:4px;align-self:stretch;background:var(--gold);border-radius:2px;opacity:0;transition:.3s;box-shadow:0 0 12px var(--gold)}
.bossword.cut .knife{opacity:1}

/* check */
.diag{display:grid;gap:16px;justify-items:center;text-align:center}
.diag .big{font-size:clamp(72px,14vw,130px);line-height:1.05}
.prog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.prog i{width:28px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
.prog i.ok{background:var(--ok)}.prog i.mid{background:var(--gold)}.prog i.bad{background:var(--bad)}.prog i.cur{background:#fff}
.res{width:100%;overflow-x:auto}
.res table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.res th,.res td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.12)}
.res th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meter{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--vc)}
.verdict{border-radius:16px;padding:12px 16px;font-weight:800;width:100%;text-align:left}
.verdict.ok{background:rgba(114,230,172,.14);color:var(--ok)}.verdict.mid{background:rgba(245,196,81,.14);color:var(--gold2)}.verdict.bad{background:rgba(255,126,148,.14);color:var(--bad)}
.hw{white-space:pre-wrap;margin:0;background:var(--parch);color:var(--parch-ink);border-radius:20px;padding:16px 20px;font-family:var(--body);font-size:16px;max-height:380px;overflow:auto}

/* cover & finale */
.cover{align-items:center;text-align:center;justify-content:center}
.cover .crown{width:120px;height:90px;filter:drop-shadow(0 0 24px rgba(245,196,81,.6));animation:hover 4s ease-in-out infinite}
.cover h1{font-size:clamp(46px,9vw,96px);background:linear-gradient(180deg,#FFF6D8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .lead{font-size:21px;color:var(--muted);max-width:40ch}
.vrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vrow span{font-family:var(--word);font-weight:700;font-size:48px;color:var(--vc);text-shadow:0 0 22px var(--vc);animation:twk 3s ease-in-out infinite}
.vrow span:nth-child(2){animation-delay:.4s}.vrow span:nth-child(3){animation-delay:.8s}.vrow span:nth-child(4){animation-delay:1.2s}.vrow span:nth-child(5){animation-delay:1.6s}.vrow span:nth-child(6){animation-delay:2s}
@keyframes twk{50%{transform:translateY(-10px);filter:brightness(1.3)}}


/* giants */
.giant{display:flex;align-items:flex-start;justify-content:center;font-family:var(--word);font-weight:700;font-size:clamp(40px,10vw,104px);line-height:1;gap:0;transition:gap .6s cubic-bezier(.3,1.4,.5,1)}
.giant.cut{gap:clamp(14px,3vw,30px)}
.giant .part{display:flex;flex-direction:column;align-items:center;gap:10px}
.giant .knife{width:4px;align-self:stretch;max-height:1.1em;background:var(--gold);border-radius:2px;opacity:0;box-shadow:0 0 12px var(--gold);transition:opacity .3s}
.giant.cut .knife{opacity:1}
.giant .tag{font-size:13px;padding:4px 10px;opacity:0;transform:translateY(-6px);transition:.4s .25s;font-family:var(--body)}
.giant.tags .tag{opacity:1;transform:none}
.giant .ipa-s{font-size:15px;color:var(--muted);opacity:0;transition:.4s .35s;font-weight:400;white-space:nowrap}
.giant.tags .ipa-s{opacity:1}
.rules2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.rules2{grid-template-columns:minmax(0,1fr)}}
.rule.k-cut{--kc:var(--gold)}
.rule .ex{font-family:var(--word);font-weight:700;font-size:30px;margin-top:6px}
.rule .ex i{font-style:normal;color:var(--gold);margin:0 4px}
.cutw{display:flex;justify-content:center;align-items:stretch;font-size:clamp(40px,10vw,100px);line-height:1.15;font-family:var(--word);font-weight:700}
.gap{width:22px;margin:0 -5px;border:0;background:none;position:relative;padding:0;z-index:1}
.gap::before{content:"";position:absolute;left:50%;top:8%;bottom:8%;width:4px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.12);transition:.2s}
.gap:hover::before{background:rgba(245,196,81,.55)}
.gap.on::before{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.gap.right::before{background:var(--ok);box-shadow:0 0 14px var(--ok)}
.gap.miss::before{opacity:.6}
.gap.wrong::before{background:var(--bad)}
.sylc{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.syl{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);min-width:140px}
.syl .word{font-size:clamp(40px,8vw,72px)}
.syl .opts{display:flex;flex-direction:column;gap:6px;width:100%}
.syl .opt{border-radius:12px;padding:7px 10px;font-size:14px;font-weight:800;border:1px solid color-mix(in srgb,var(--kc) 60%,transparent);background:transparent;color:var(--kc)}
.syl .opt.right{background:var(--kc);color:var(--night)}
.syl .opt.wrong{opacity:.4;text-decoration:line-through}
.syl .sn{font-family:var(--word);color:var(--muted);font-size:16px}

/* per-vowel sounds */
.vsnds{display:grid;gap:12px}
.vsnd{display:grid;grid-template-columns:minmax(150px,190px) minmax(140px,170px) minmax(0,1fr) minmax(0,1fr);gap:12px 16px;align-items:center;border-radius:22px;padding:14px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--kc) 14%,transparent),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--kc) 45%,transparent)}
@media (max-width:900px){.vsnd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:520px){.vsnd{grid-template-columns:minmax(0,1fr)}}
.vsnd .vh{display:flex;align-items:center;gap:8px;font-family:var(--title);font-size:21px;color:var(--kc)}
.vsnd .vh svg{width:30px;height:30px;flex:0 0 auto}
.vsnd .vs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vsnd .vs .ipa{font-size:34px;font-weight:700}
.vsnd .vs small{flex-basis:100%;color:var(--muted);font-size:14px;line-height:1.3}
.vsnd .vx{display:flex;flex-direction:column;gap:4px;min-width:0}
.vsnd .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.vsnd .ws{display:flex;flex-wrap:wrap;gap:4px 14px}
.vsnd .ws button{border:0;background:none;padding:0;font-size:28px;line-height:1.2}
.vsnd .none{font-size:14px;color:var(--muted)}
.mw{display:inline-flex;align-items:flex-start;font-family:var(--word);font-weight:700;white-space:nowrap}
.mw .sep{font-style:normal;color:var(--gold);opacity:.75;margin:0 .06em;font-weight:400}
.mw .mp{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.mw .mp.weak .word{opacity:.5}
.mw .mp .tag{font-size:13px;padding:3px 10px;font-family:var(--body)}
.train .big.multi{font-size:clamp(52px,11vw,110px)}

/* homework */
.oddg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:560px}
.oddg .pq{min-width:0;font-size:clamp(40px,8vw,64px);padding:12px}
.quiz{display:grid;gap:18px;justify-items:center;text-align:center}
.qbig{font-size:clamp(72px,14vw,130px);line-height:1.05}
.qq{font-size:21px;font-weight:700;max-width:40ch;text-align:center;margin:0 auto}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:720px}
@media (max-width:560px){.qopts{grid-template-columns:minmax(0,1fr)}}
.qopt{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:20px;padding:14px;font-family:var(--title);font-size:21px;color:var(--kc);background:color-mix(in srgb,var(--kc) 12%,transparent);border:2px solid color-mix(in srgb,var(--kc) 55%,transparent);transition:transform .12s}
.qopt svg{width:30px;height:30px;flex:0 0 auto}
.qopt:active{transform:translateY(2px)}
.qopt.right{background:var(--kc);color:var(--night)}
.qopt.right svg *{fill:var(--night);stroke:var(--night)}
.qopt.wrong{opacity:.4;text-decoration:line-through}
.pairq{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pq{min-width:200px;border-radius:24px;padding:16px 24px;background:var(--parch);color:var(--parch-ink);border:3px solid transparent;font-size:clamp(48px,9vw,80px);line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #CDB98A}
.pq small{font-family:var(--body);font-size:15px;font-weight:700;color:#6B5A8E}
.pq .word .vw{text-shadow:none;filter:brightness(.78) saturate(1.3)}
.pq.right{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok),0 6px 0 #CDB98A}
.pq.wrong{opacity:.5}
.parent{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;border-top:1px dashed rgba(255,255,255,.2);padding-top:14px;width:100%}
.parent span{color:var(--muted);font-weight:700}
.done{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:20px}
.stars{display:flex;gap:10px}
.stars svg{width:64px;height:64px;fill:rgba(255,255,255,.15)}
.stars svg.on{fill:var(--gold);filter:drop-shadow(0 0 12px var(--gold));animation:pop .6s both}
.stars svg.on:nth-child(2){animation-delay:.15s}.stars svg.on:nth-child(3){animation-delay:.3s}
.stars.sm svg{width:26px;height:26px}
.memo{background:var(--parch);color:var(--parch-ink);border-radius:22px;padding:16px 20px;display:grid;gap:8px;text-align:left;max-width:720px;width:100%}
.memo h3{color:#7A2E8E}
.mrow{display:flex;gap:10px;align-items:center;font-size:17px}
.mrow svg{width:28px;height:28px;flex:0 0 auto}
.mrow.k-cut{--kc:#B98A1E}
.memo .word{font-size:22px}
.memo .word .vw{text-shadow:none;filter:brightness(.75) saturate(1.3)}
.parents{max-width:720px;font-size:15px;color:var(--muted);text-align:left;border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.04)}
.parents b{color:var(--gold2)}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.repc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border-radius:20px;padding:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.repc .rn{font-family:var(--title);font-size:19px;color:var(--gold2)}
.repc.todo{border-style:dashed;opacity:.8}


/* chameleon */
.cham{width:100%;height:auto;display:block;overflow:visible}
.cham .cb{fill:var(--cham);transition:fill 1.6s ease}
.cham .ct{fill:none;stroke:var(--cham);stroke-width:11;stroke-linecap:round;transition:stroke 1.6s ease}
.cham .cd{fill:none;stroke:color-mix(in srgb,var(--cham) 60%,#1a1050);stroke-width:5;stroke-linejoin:round;transition:stroke 1.6s ease}
.cham .cl{stroke:color-mix(in srgb,var(--cham) 60%,#1a1050);stroke-width:9;stroke-linecap:round;transition:stroke 1.6s ease}
.cham .cs{fill:color-mix(in srgb,var(--cham) 70%,#fff);opacity:.75;transition:fill 1.6s ease}
.cham .pupil{animation:look 5s ease-in-out infinite}
@keyframes look{0%,40%{transform:translate(0,0)}50%,70%{transform:translate(-5px,2px)}80%,100%{transform:translate(0,0)}}
.cham{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--cham) 45%,transparent));transition:filter 1.6s}
.covcham{width:min(300px,70vw);animation:hover 4s ease-in-out infinite}
.chamstage{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:700px){.chamstage{grid-template-columns:minmax(0,1fr)}.chamstage .cham{max-width:240px;margin:0 auto}}
.colcard{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:color-mix(in srgb,var(--cc) 10%,transparent);border:2px solid color-mix(in srgb,var(--cc) 40%,transparent);transition:transform .6s cubic-bezier(.3,1.4,.5,1),background .8s,box-shadow .8s}
.colcard b{font-family:var(--title);font-weight:400;font-size:22px;color:var(--cc)}
.colcard .csnd{font-size:26px;font-weight:800}
.colcard .lw{font-size:44px;margin-top:4px}
.colcard.cur{transform:translateY(-6px);background:color-mix(in srgb,var(--cc) 22%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--cc) 35%,transparent)}
.cdot{width:16px;height:16px;border-radius:50%;background:var(--cc);box-shadow:0 0 12px var(--cc)}
.lw{font-family:var(--word);font-weight:700;letter-spacing:.03em;display:inline-flex;align-items:baseline;white-space:nowrap}
.lw span{display:inline-block;transition:color 1.2s ease,transform 1.2s cubic-bezier(.3,1.4,.5,1),text-shadow 1.2s}
.lw .t{color:var(--gold2);transform:translateY(-8px) scale(1.12)}
.lw.on .t{color:var(--cc);text-shadow:0 0 26px var(--cc)}
.lw .nb{text-decoration:underline;text-decoration-thickness:5px;text-decoration-color:var(--gold);text-underline-offset:10px}
.lsep{font-style:normal;color:var(--gold);opacity:.8;margin:0 .08em;font-weight:400;animation:pop .6s both}
.lbig{font-size:clamp(64px,13vw,124px);line-height:1.1}
.ctag{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--cc) 22%,transparent);color:var(--cc);border:1px solid color-mix(in srgb,var(--cc) 60%,transparent)}
.bin3 .cham{width:110px}
.bin3 .ct{color:var(--kc)}
.lwc{font-family:var(--word);font-weight:700;font-size:22px;background:rgba(255,255,255,.08);border-radius:10px;padding:0 10px;animation:pop .45s both}
.chip .lw{font-size:30px}
.lab{display:grid;gap:16px;justify-items:center;text-align:center}
.labw{display:flex;gap:6px;font-family:var(--word);font-weight:700;font-size:clamp(90px,16vw,150px);line-height:1}
.lbL{color:var(--ink);transition:color 1.4s ease,text-shadow 1.4s}
.lbL.on{color:var(--cc);text-shadow:0 0 34px var(--cc)}
.lbN{color:var(--gold2);min-width:.6em;border-bottom:6px dashed rgba(245,196,81,.5)}
.lbN.fly{animation:fly .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes fly{from{transform:translate(120px,-40px) rotate(30deg);opacity:0}to{transform:none;opacity:1}}
.labmsg{font-size:24px;font-weight:700;min-height:70px}
.nbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.nbtn{min-width:58px;height:58px;padding:0 14px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-family:var(--word);font-size:28px;font-weight:700}
.nbtn.magic{border-color:var(--gold);color:var(--gold2)}
.nbtn.cur{background:var(--gold);color:var(--night)}
.bully{border-radius:18px;padding:12px 16px;background:rgba(255,126,148,.12);border:1px dashed #FF7E94;font-size:17px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.bully .lw{font-size:30px}
.bully b{color:#FF9FB5}

/* hub / tree */
[hidden]{display:none!important}
.top-in{flex-wrap:wrap}
.hubbar{flex:1;display:flex;justify-content:flex-end;min-width:0}
.stubar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.stu{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 16px;font-weight:800;font-size:15px;color:var(--muted)}
.stu.cur{background:var(--gold);color:var(--night);border-color:var(--gold)}
.stu.add{border-style:dashed}
.addf{display:flex;gap:6px}
.addf input{font:inherit;font-size:15px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);padding:7px 14px;width:150px}
.lessonbar{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.ltitle{font-family:var(--title);color:var(--gold2);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
body:not(.inlesson) .lnav{display:none}
body.inlesson .hubbar{display:none}
body:not(.inlesson) main{padding-bottom:40px}
.hubgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.hubgrid{grid-template-columns:minmax(0,1fr)}}
.treewrap{background:radial-gradient(ellipse at 50% 40%,rgba(80,60,160,.35),transparent 70%);border-radius:30px;border:1px solid var(--line);padding:10px;overflow:hidden}
.treebox{position:relative;width:100%;aspect-ratio:1000/1080;container-type:inline-size}
.treesvg{position:absolute;inset:0;width:100%;height:100%}
.branch{fill:none;stroke:#5A3F8E;stroke-width:16;stroke-linecap:round}
.stem{stroke:rgba(255,230,160,.35);stroke-width:2.5}
.rootl{fill:none;stroke:rgba(245,196,81,.35);stroke-width:5;stroke-linecap:round}
.blbl{font-family:'Kurale',Georgia,serif;font-size:24px}
.ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFE6A0;box-shadow:0 0 10px #FFE6A0;animation:ffly 7s ease-in-out infinite;pointer-events:none;opacity:.7}
@keyframes ffly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(18px,-26px);opacity:.9}}
.fruit{position:absolute;width:7.2cqw;height:7.2cqw;min-width:28px;min-height:28px;margin-left:-3.6cqw;margin-top:-3.6cqw;border-radius:50%;display:grid;place-items:center;padding:0;font-family:var(--word);font-weight:700;font-size:max(10px,2.25cqw);line-height:.95;text-align:center;transition:background 1.6s ease,box-shadow 1.6s ease,color 1.6s ease,transform .6s cubic-bezier(.3,1.5,.5,1);border:0;z-index:2}
.fruit:hover{transform:scale(1.12)}
.fruit.st-todo{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(255,255,255,.05));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);color:rgba(255,255,255,.6)}
.fruit.st-now{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),color-mix(in srgb,var(--fc) 35%,#1a1050));box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(245,196,81,.5);color:#fff;animation:nowp 2.4s ease-in-out infinite}

/* ---------- task 1: syllable type of one-syllable words ---------- */
function t1(root){const items=shuffle(LV.filter(v=>!KNOWN||KNOWN.has(v)).flatMap(v=>{const c=shuffle(WORDS.filter(w=>w.v===v&&w.t==='closed'&&good(w)))[0];const o=shuffle(WORDS.filter(w=>w.v===v&&w.t!=='closed'&&good(w)))[0];return [c,o]}).filter(Boolean));if(!items.length){root.innerHTML='<p class="muted" style="text-align:center">Сначала пройдите хотя бы одну гласную.</p>';return}

     <div class="row center">${a?sayBtn(w.w)+`<button class="btn gold" data-nx>${k<items.length-1?'Дальше →':'Готово!'}</button>`:''}</div></div>`;
    $$('[data-t]',root).forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t===w.t){ok++;confetti(...center(b),24)}else miss.push(w.w);say(w.w);draw(t)});

/* ---------- task 2: pairs ---------- */
function t2(root){const items=shuffle(LV.flatMap(v=>shuffle(V[v].pairs.split(',')).slice(0,v==='e'||v==='u'?1:2).map(p=>{const [a,b]=p.split('-');return {v,a,b,askName:Math.random()<.5}})));
  let k=0,ok=0;const miss=[];
  function draw(ans){const it=items[k];const L=V[it.v].L;const right=it.askName?it.b:it.a;const opts=Math.random()<.5?[it.a,it.b]:[it.b,it.a];it.opts=it.opts||opts;
    const q=it.askName?`В каком слове <b>${L}</b> читается <b>как в алфавите</b> <span class="ipa">${V[it.v].name}</span>?`:`В каком слове <b>${L}</b> читается <b>коротко</b> <span class="ipa">${V[it.v].short}</span>?`;

     <div class="pairq">${it.opts.map(s=>{let c='';if(ans){if(s===right)c='right';else if(s===ans)c='wrong'}return `<button class="pq ${c}" data-p="${s}" ${ans?'disabled':''}>${ans?wordHTML(W(s)):`<span class="word">${s}</span>`}${ans?`<small>${W(s).ru}</small>`:''}</button>`}).join('')}</div>
     <div class="fb ${ans?(ans===right?'ok':'bad'):''}">${ans?(ans===right?'Верно! ':'Посмотри ещё раз. ')+(V[it.v].door?`В ${it.b} слог открытый — E говорит своё имя.`:`В ${it.b} есть немая e — она открывает слог.`):'Подсказка: ищи немую e на конце или гласную в конце слова.'}</div>
     <div class="row center">${ans?sayBtn(it.a)+sayBtn(it.b)+`<button class="btn gold" data-nx>${k<items.length-1?'Дальше →':'Готово!'}</button>`:''}</div></div>`;

/* ---------- task 3: odd one out ---------- */
function t3(root){const items=shuffle(LV.filter(v=>!KNOWN||KNOWN.has(v)).map(v=>{const cl=shuffle(WORDS.filter(w=>w.v===v&&w.t==='closed'&&good(w)));const nm=shuffle(WORDS.filter(w=>w.v===v&&w.t!=='closed'&&good(w)));
    let oddName=Math.random()<.5;if(nm.length<4)oddName=true;const base=oddName?cl.slice(0,3):nm.slice(0,3);const odd=oddName?nm[0]:cl[0];return {v,odd,oddName,opts:shuffle([...base,odd])}}).filter(it=>it.odd&&it.opts.length===4&&it.opts.every(Boolean)));if(!items.length){root.innerHTML='<p class="muted" style="text-align:center">Пока мало знакомых слов для этой игры.</p>';return}

     <div class="fb ${ans?(ans===it.odd.w?'ok':'bad'):''}">${ans?(ans===it.odd.w?'Верно! ':'Не совсем. ')+`Лишнее — <b>${it.odd.w}</b>: здесь ${L} ${it.oddName?'читается как в алфавите':'читается коротко'} <span class="ipa">${snd(it.odd)}</span>, а в остальных ${it.oddName?'коротко':'как в алфавите'}.`:'Подсказка: посмотри, на что кончается каждый слог и есть ли немая e.'}</div>
     <div class="row center">${ans?`<button class="btn gold" data-nx>${k<items.length-1?'Дальше →':'Готово!'}</button>`:''}</div></div>`;
    $$('[data-o]',root).forEach(b=>b.onclick=()=>{const s2=b.dataset.o;if(s2===it.odd.w){ok++;confetti(...center(b),24)}else miss.push(it.opts.map(w=>w.w).join('/'));say(it.odd.w);draw(s2)});
    const nx=$('[data-nx]',root);if(nx)nx.onclick=()=>{if(k<items.length-1){k++;draw()}else{setRes('t3',ok,items.length,miss);finish(root,ok,items.length)}}}

/* ---------- task 4: giants (cut + classify) ---------- */
function t4(root){const items=shuffle(LV.map(v=>pick([...MULTI[v].closed,...MULTI[v].open,...MULTI[v].magic].filter(s=>s.split('|').filter(x=>x[0]!=='*').length>=1))));
  let k=0,ok=0,all=0;const miss=[];let sel,checked,phase,ans;

  function draw(){const g=gWord(items[k]);let body='';
    if(phase==='cut'){let h='';for(let i=0;i<g.word.length;i++){if(i>0){let c='';if(checked){if(g.cuts.includes(i))c=sel.has(i)?'right':'right miss';else if(sel.has(i))c='wrong'}else if(sel.has(i))c='on';h+=`<button class="gap ${c}" data-gp="${i}" aria-label="Разрезать здесь" ${checked?'disabled':''}></button>`}h+=`<span>${g.word[i]}</span>`}
      const gd=checked&&g.cuts.length===sel.size&&g.cuts.every(c=>sel.has(c));

       ${checked?`<div class="fb ${gd?'ok':'bad'}">${gd?'Точный разрез! ':'Правильный разрез — зелёный. '}<br>${g.cuts.map((_,i)=>cutReason(g,i)).join('<br>')}</div>`:''}
       <div class="row center">${checked?'<button class="btn gold" data-np>Шаг 2 →</button>':'<button class="btn" data-clr>Стереть</button><button class="btn gold" data-chk>Проверить</button>'}</div>`}

        <div class="opts">${['closed','open','magic'].map(t=>{let c='';if(a!=null){if(t===x.t)c='right';else if(t===a)c='wrong'}return `<button class="opt k-${K[t].k} ${c}" data-pp="${pi}" data-ty="${t}" ${a!=null?'disabled':''}>${K[t].n}</button>`}).join('')}</div>
        ${a!=null?`<span class="sn">${x.weak?'шепчет':snd(x)}</span>`:''}</div>`}).join('')}</div>
        ${done?`<div class="row center"><span class="word" style="font-size:40px">${g.word}</span>${sayBtn(g.word)}<span class="muted">${RU[g.word]||''}</span><button class="btn gold" data-nw>${k<items.length-1?'Следующий великан →':'Готово!'}</button></div>`:''}`}
    root.innerHTML=`<div class="quiz"><div class="bar5">${items.map((_,i)=>`<i class="${i<k?'on':''}"></i>`).join('')}</div>${body}</div>`;
    const q=x=>root.querySelector(x);

    if(q('[data-clr]'))q('[data-clr]').onclick=()=>{sel.clear();draw()};
    if(q('[data-chk]'))q('[data-chk]').onclick=()=>{checked=true;all++;const gd=g.cuts.length===sel.size&&g.cuts.every(c=>sel.has(c));if(gd){ok++;setTimeout(()=>confetti(...center(q('#cw')),40),30)}else miss.push(g.parts.map(x=>x.w).join('|'));draw()};
    if(q('[data-np]'))q('[data-np]').onclick=()=>{phase='class';draw()};
    $$('[data-pp]',root).forEach(b=>b.onclick=()=>{const pi=+b.dataset.pp;ans[pi]=b.dataset.ty;all++;if(ans[pi]===g.parts[pi].t){ok++;confetti(...center(b),20)}else miss.push(g.parts[pi].w+' ('+g.word+')');draw();if(g.parts.every((_,i)=>ans[i]!=null))say(g.word)});

/* ---------- task 5: read aloud with a parent ---------- */
function t5(root){const singles=shuffle(LV.flatMap(v=>shuffle(WORDS.filter(w=>w.v===v&&good(w))).slice(0,1))).map(w=>w.w);
  const extra=shuffle(WORDS.filter(w=>LV.includes(w.v)&&good(w)&&!singles.includes(w.w))).slice(0,3).map(w=>w.w);
  const multis=shuffle(LV.map(v=>pick([...MULTI[v].closed,...MULTI[v].open,...MULTI[v].magic]))).slice(0,4);

function tIdx(it){const s=plain(it);if(it.L==='y')return s[0]==='y'?0:s.lastIndexOf('y');return s.indexOf(it.L)}
function why(it){const s=plain(it),t=tIdx(it),nx=s[t+1];const c=CATS[it.cat];
  if(it.cat==='j')return 'Y стоит <b>в начале слова</b> — значит, это согласная. Говорит «й».';
  if(it.cat==='ai')return 'Y на конце, а <b>других гласных в слове нет</b>. Один слог — Y говорит «ай», как I в алфавите.';
  if(it.cat==='i'){const v=[...s.slice(0,-1)].find(ch=>'aeiou'.includes(ch));return `Y на конце, и в слове есть <b>ещё гласная — ${v.toUpperCase()}</b>. Значит, слогов два: <b>${it.w}</b>. Y говорит «и».`}
  const L=it.L.toUpperCase();
  if(it.cat==='s'||it.cat==='dj')return `После ${L} стоит <b>${nx.toUpperCase()}</b> — волшебная соседка. ${L} говорит ${c.snd}.`;
  return nx?`После ${L} стоит <b>${nx.toUpperCase()}</b> — это не E, не I и не Y. ${L} говорит ${c.snd}.`:`${L} стоит <b>в конце слова</b>, соседки нет. ${L} говорит ${c.snd}.`}
function lw(it,o){o=o||{};const s=plain(it),t=tIdx(it),sp=it.w.indexOf('|');const col=CATS[it.cat].col;let h='';
  for(let i=0;i<s.length;i++){if(o.split&&sp>0&&i===sp)h+='<i class="lsep">|</i>';let c='';
    if(o.hl&&i===t)c='t';if(o.nb&&it.L!=='y'&&i===t+1)c='nb';if(o.nb&&it.L==='y'&&it.cat==='i'&&i<t&&'aeiou'.includes(s[i]))c='nb';
    h+=`<span class="${c}">${s[i]}</span>`}
  return `<span class="lw ${o.col?'on':''}" style="--cc:${col}">${h}</span>`}

    <div class="row" style="justify-content:space-between"><span class="score">Верно: <b>${ok}</b> · Ошибок: ${miss}</span><button class="btn sm" data-rs>Новые слова</button></div></div>`}
  root.onclick=e=>{const ch=e.target.closest('[data-ch]');if(ch){sel=+ch.dataset.ch;draw();say(plain(left[sel]));return}
    const bin=e.target.closest('[data-bin]');
    if(bin&&sel!=null){const it=left[sel],k=bin.dataset.bin;
      if(it.cat===k){ok++;left.splice(sel,1);placed[k].push(it);sel=null;draw();confetti(...center(root.querySelector(`[data-bin="${k}"]`)),left.length?24:100)}
      else{miss++;const c=root.querySelector(`[data-ch="${sel}"]`);c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');const f=root.querySelector('.score');f.innerHTML=`Подсказка: ${why(it)}`;setTimeout(()=>{sel=null;draw()},2600)}return}
    if(e.target.closest('[data-rs]')){left=src();keys.forEach(k=>placed[k]=[]);sel=null;draw()}};
  draw()}

function chDiag(root){const list=R([...R(YW).slice(0,4),...R(CW).slice(0,3),...R(GW).slice(0,3)]);const rev=R(WORDS.filter(w=>LV.includes(w.v)&&good(w))).slice(0,2).map(w=>({w:w.w,ru:w.ru,rev:true,wo:w}));const all=R([...list,...rev]);
  let k=0;const marks=[];
  const draw=()=>{const pr=`<div class="prog">${all.map((_,i)=>`<i class="${marks[i]||(i===k?'cur':'')}"></i>`).join('')}</div>`;
    if(k<all.length){const it=all[k];root.innerHTML=`<div class="diag">${pr}<div class="eyebrow">Слово ${k+1} из ${all.length}</div><div class="big lbig">${it.rev?`<span class="word">${it.w}</span>`:lw(it)}</div>
      <span class="tans">${it.rev?K[it.wo.t].n+' · '+snd(it.wo):CATS[it.cat].n}· ${it.ru}</span>
      <div class="row center"><button class="btn ok" data-m="ok">Прочитала</button><button class="btn gold" data-m="mid">С подсказкой</button><button class="btn bad" data-m="bad">Ошибка</button>${sayBtn(plain(it))}</div></div>`;
      $$('[data-m]',root).forEach(b=>b.onclick=()=>{marks[k]=b.dataset.m;k++;if(b.dataset.m==='ok')confetti(...center(b),18);draw()});return}
    const grp=it=>it.rev?'Слоги (повторение)':it.L==='y'?'Хамелеон Y':'Буквы C и G';const rows={};
    all.forEach((it,i)=>{const g=grp(it);const r=rows[g]||(rows[g]={ok:0,n:0,bad:[]});if(marks[i]==='ok')r.ok++;else r.bad.push(plain(it));r.n++});
    const ok=marks.filter(m=>m==='ok').length,pct=Math.round(ok/all.length*100);
    const v=pct>=80?['ok','Отлично! Можно идти дальше по учебнику: Unit 4 (ai, ay).']:pct>=50?['mid','Хорошо! На следующем уроке 10 минут повторим хамелеонов.']:['bad','Хамелеоны пока прячутся. Повторим их ещё раз в начале следующего урока.'];
    root.innerHTML=`<div class="diag">${pr}<div class="big" style="font-size:80px;font-family:var(--title);color:var(--gold2)">${pct}%</div><div class="verdict ${v[0]}">${v[1]}</div>
     <div class="res"><table><thead><tr><th>Блок</th><th>Сама</th><th>Повторить</th></tr></thead><tbody>${Object.keys(rows).map(g=>`<tr><td>${g}</td><td>${rows[g].ok}/${rows[g].n}</td><td>${rows[g].bad.join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div>
     <div class="row center"><button class="btn gold" data-ag>Новые слова</button></div></div>`;
    if(pct>=80)confetti(innerWidth/2,innerHeight/3,140);$('[data-ag]',root).onclick=()=>chDiag(root)};
  draw()}

function needs(word){const s=String(word).toLowerCase().replace(/[^a-z]/g,'');const R=new Set();let i=0;

    const ch=s[i],nx=s[i+1];
    if(ch==='y')R.add('y');else if(ch==='c'&&nx&&'eiy'.includes(nx))R.add('c');else if(ch==='g'&&nx&&'eiy'.includes(nx))R.add('g');

function checkSlide(id,gen){const n=NODE[id];return {id:id+'-chk',ch:n.lbl,r:el=>{el.innerHTML=`<div><div class="eyebrow">Проверка · ${n.title}</div><h2 class="st">Прочитай сама</h2></div>

     root.innerHTML=`<div class="diag">${pr}<div class="big" style="font-size:80px;font-family:var(--title);color:var(--gold2)">${pct}%</div><div class="verdict ${v[0]}">${v[1]}</div>${bad.length?`<div class="warn"><b>Повторить:</b> ${bad.join(', ')}</div>`:''}<div class="row center"><button class="btn" data-ag>Другие слова</button></div></div>`;
     if(pct>=80)confetti(innerWidth/2,innerHeight/3,120);$('[data-ag]',root).onclick=run;markBox($('#mk',el),id,pct>=80?'done':'now')};draw()};run();markBox($('#mk',el),id)}}}
function markBox(root,id,suggest){const s=curStudent();const n=NODE[id];

  return [...pick3.map(x=>SL.find(s=>s.id===x)),checkSlide(id,()=>shuffle(src.slice()).slice(0,8).map(it=>({html:lw(it),say:plain(it),info:CATS[it.cat].n+' · '+it.ru})))]}

async function setStatus(sid,id,v){const s=students.find(x=>x.id===sid);if(!s)return;s.progress=Object.assign({},s.progress,{[id]:v});

async function initDb(){let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}

const bz=(p,t)=>{const u=1-t;return [0,1].map(j=>u*u*u*p[0][j]+3*u*u*t*p[1][j]+3*u*t*t*p[2][j]+t*t*t*p[3][j])};

function layout(){const L={};BRANCHES.forEach(b=>{if(b.id==='roots'){b.nodes.forEach((id,i)=>{const x=140+i*144,y=i%2?1022:1040;L[id]={x,y,ax:500+(x-500)*.35,ay:995}});return}
  const g=GEO[b.id],n=b.nodes.length;const alt=n>4;b.nodes.forEach((id,i)=>{const t=n===1?.6:.22+i*(.74/(n-1));const [ax,ay]=bz(g,t);const hang=alt?(i%2?118:42):46;L[id]={x:ax,y:ay+hang+34,ax,ay}})});return L}

  return `<svg class="treesvg" viewBox="0 0 ${W0} ${H0}" aria-hidden="true"><defs><radialGradient id="glw"><stop offset="0" stop-color="#3FD3B0" stop-opacity=".35"/><stop offset="1" stop-color="#3FD3B0" stop-opacity="0"/></radialGradient><radialGradient id="glw2"><stop offset="0" stop-color="#A06BFF" stop-opacity=".35"/><stop offset="1" stop-color="#A06BFF" stop-opacity="0"/></radialGradient>
   <linearGradient id="trk" x1="0" x2="1"><stop offset="0" stop-color="#3B2768"/><stop offset=".5" stop-color="#6A4C9C"/><stop offset="1" stop-color="#3B2768"/></linearGradient></defs>
   <circle cx="320" cy="420" r="330" fill="url(#glw)"/><circle cx="700" cy="380" r="340" fill="url(#glw2)"/><circle cx="520" cy="640" r="300" fill="url(#glw)"/>
   <rect x="0" y="990" width="1000" height="90" fill="#140F38"/><path d="M0 995 Q500 960 1000 995" stroke="#2E2470" stroke-width="6" fill="none"/>
   ${roots}<path d="M455 1000 C470 850 470 600 487 320 L513 320 C530 600 530 850 545 1000 Z" fill="url(#trk)"/>${br}${stems}${lbls}</svg>`}

   root.innerHTML=`<div class="quiz"><div class="bar5">${rounds.map((_,i)=>`<i class="${i<k||(i===k&&ans)?'on':''}"></i>`).join('')}</div>
    ${mode==='see'?`<div class="cl-cham big">${chameleon(c.c)}</div>`:`<div class="row center"><button class="btn gold" data-play style="font-size:22px">Послушать слово ${SPK}</button></div>`}
    <div class="${mode==='see'?'qopts':'pots'}">${(root._opts=root._opts&&ans?root._opts:opts).map(x=>mode==='see'?`<button class="qopt ${ans?(x.w===c.w?'right':x.w===ans?'wrong':''):''}" style="--kc:${x.c==='#15151D'?'#C9C6EC':x.c}" data-a="${x.w}" ${ans?'disabled':''}><span class="pw" style="font-size:30px">${x.w}</span></button>`:`<button class="potb ${ans&&x.w===c.w?'cur':''}" data-a="${x.w}" ${ans?'disabled':''}>${pot(x.c,90)}${ans?`<span>${x.w}</span>`:''}</button>`).join('')}</div>
    <div class="fb ${ans?(right?'ok':'bad'):''}">${ans?(right?`Верно! It’s <b>${c.w}</b> — ${c.ru}.`:`Это <b>${c.w}</b> — ${c.ru}.`):''}</div>
    <div class="row center">${ans?`<button class="btn gold" data-nx>${k<rounds.length-1?'Дальше →':'Ещё раз'}</button>`:''}<span class="score">Верно: <b>${ok}</b></span></div></div>`;
   const pl=root.querySelector('[data-play]');if(pl)pl.onclick=()=>say(c.w);
   $$('[data-a]',root).forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a===c.w){ok++;confetti(...center(b),30)}say(c.w);draw(a)});
   const nx=root.querySelector('[data-nx]');if(nx)nx.onclick=()=>{root._opts=null;if(k<rounds.length-1){k++;draw()}else colGame(root,mode)};
   if(!ans&&mode==='hear')setTimeout(()=>say(c.w),400)}
  root._opts=null;draw()}
const MIX={'red+yellow':'orange','blue+yellow':'green','blue+red':'purple','red+white':'pink','black+white':'gray','green+red':'brown'};
function mixer(root){const base=['red','yellow','blue','white','black','green'].map(colOf);let a=null,b=null,guess=null,mixed=false;
  function draw(){const key=a&&b?[a.w,b.w].sort().join('+'):null;const res=key&&MIX[key]?colOf(MIX[key]):null;
   const opts=res?(root._g=root._g||shuffle([res,...shuffle(COLS.filter(x=>x!==res&&x!==a&&x!==b)).slice(0,2)])):null;
   root.innerHTML=`<div class="mix"><div class="pots">${base.map(x=>`<button class="potb ${x===a||x===b?'cur':''} ${mixed?'':''}" data-mp="${x.w}" ${mixed?'disabled':''}>${pot(x.c,74)}<span>${x.w}</span></button>`).join('')}</div>
    <div class="mixrow"><div class="mslot">${a?pot(a.c,80):'<span>?</span>'}</div><span class="mplus">+</span><div class="mslot">${b?pot(b.c,80):'<span>?</span>'}</div><span class="mplus">=</span>
     <div class="bowl ${mixed?'go':''}"><div class="bw1" style="background:linear-gradient(90deg,${a?a.c:'transparent'} 50%,${b?b.c:'transparent'} 50%)"></div><div class="bw2" style="background:${res?res.c:'#6B5A50'}"></div></div></div>
    ${a&&b&&!res?`<div class="fb bad">Получилась грязная лужа! Такой рецепт хамелеон не знает. Попробуй другую пару.</div><div class="row center"><button class="btn" data-rs>Заново</button></div>`:''}
    ${res&&!mixed?`<div class="qq">Как думаешь, какой цвет получится?</div><div class="qopts">${opts.map(x=>`<button class="qopt ${guess?(x===res?'right':x.w===guess?'wrong':''):''}" style="--kc:${x.c}" data-gs="${x.w}" ${guess?'disabled':''}><span class="pw" style="font-size:26px">${x.w}</span></button>`).join('')}</div>${guess?`<div class="row center"><button class="btn gold" data-mix>Смешать!</button></div>`:''}`:''}
    ${mixed?`<div class="fb ok mixsent"><span class="pw">${a.w[0].toUpperCase()+a.w.slice(1)} and ${b.w} make <b style="color:${res.c==='#15151D'?'#fff':res.c}">${res.w}</b>!</span> ${sayBtn(`${a.w} and ${b.w} make ${res.w}`)}</div><div class="row center"><button class="btn gold" data-rs>Другие краски</button></div>`:''}</div>`;
   $$('[data-mp]',root).forEach(x=>x.onclick=()=>{const c=colOf(x.dataset.mp);if(c===a){a=null}else if(c===b){b=null}else if(!a)a=c;else if(!b)b=c;else{a=b;b=c}guess=null;root._g=null;say(c.w);draw()});
   $$('[data-gs]',root).forEach(x=>x.onclick=()=>{guess=x.dataset.gs;if(guess===res.w)confetti(...center(x),30);draw()});
   const m=root.querySelector('[data-mix]');if(m)m.onclick=()=>{mixed=true;draw();setTimeout(()=>{say(`${a.w} and ${b.w} make ${res.w}`);confetti(...center(root.querySelector('.bowl')),70)},2300)};
   const r=root.querySelector('[data-rs]');if(r)r.onclick=()=>{a=b=null;guess=null;mixed=false;root._g=null;draw()}}
  draw()}
function wsGame(root){const ks=Object.keys(SHAPES);let shown=false,cur=null;
  function next(){cur={s:pick(ks),c:pick(COLS)};shown=false;draw()}
  function draw(){root.innerHTML=`<div class="train"><div class="wsshape">${shape(cur.s,cur.c.c)}</div>
    <div class="info">${shown?`<span class="pw" style="font-size:40px">It’s <span style="color:${cur.c.c==='#15151D'?'#fff':cur.c.c}">${cur.c.w}</span>.</span> ${sayBtn('It is '+cur.c.w)} <span class="muted">${cur.c.ru}</span>`:'Ответь полным предложением: <b>It’s …</b>'}</div>
    <div class="row center"><button class="btn" data-q>Спросить ${SPK}</button><button class="btn" data-sh>${shown?'Спрятать':'Проверить'}</button><button class="btn gold" data-nx>Следующая картинка →</button></div></div>`;
   root.querySelector('[data-q]').onclick=()=>say('What colour is it?');root.querySelector('[data-sh]').onclick=()=>{shown=!shown;draw();if(shown)say("It's "+cur.c.w)};root.querySelector('[data-nx]').onclick=()=>{next();say('What colour is it?')}}
  next()}
function hunt(root){let c=null,tm=null;
  function start(){c=pick(COLS);clearInterval(tm);let left=20;draw(left);say('Find something '+c.w);tm=setInterval(()=>{if(!document.body.contains(root)){clearInterval(tm);return}left--;const t=root.querySelector('.hleft');if(t)t.textContent=left;if(left<=0){clearInterval(tm);const t2=root.querySelector('.hmsg');if(t2)t2.textContent='Время вышло! Успела?'}},1000)}
  function draw(left){root.innerHTML=`<div class="hunt"><div class="hsplash" style="--hc:${c.c}"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="hring" style="stroke:${c.c==='#15151D'?'#C9C6EC':c.c}"/></svg><span class="hleft">${left}</span></div>
    <div class="phrase">Find something <span style="color:${c.c==='#15151D'?'#fff':c.c};text-shadow:0 0 14px ${c.c}">${c.w}</span>!</div><div class="muted hmsg">Найди что-нибудь — ${c.ru.split(',')[0]}!</div>
    <div class="row center">${sayBtn('Find something '+c.w)}<button class="btn ok" data-found>Нашла!</button><button class="btn gold" data-new>Другой цвет</button></div></div>`;
   root.querySelector('[data-found]').onclick=e=>{clearInterval(tm);confetti(...center(e.currentTarget),90);say("It's "+c.w+"!")};root.querySelector('[data-new]').onclick=start}
  start()}

renderHub();initDb();
})();
</script>
