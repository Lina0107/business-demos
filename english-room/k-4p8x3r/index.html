<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Свиток Кати</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kurale&family=Andika:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: ночное сказочное королевство — один слайд за раз в центре, звёздное небо и силуэт замка на фоне, сверху тропинка-прогресс по главам. Намеренно одна (ночная) тема. */
:root{
  color-scheme:dark;
  --night:#0B0E2E; --night2:#171A52; --plum:#2A1C5C;
  --card:rgba(22,24,74,.78); --card2:rgba(255,255,255,.07); --line:rgba(245,196,81,.32);
  --ink:#FFF8EC; --muted:#C9C6EC; --gold:#F5C451; --gold2:#FFE6A0; --parch:#FFF4DA; --parch-ink:#3A2366;
  --a:#FF7E94; --o:#FFB65C; --i:#86B6FF; --u:#C9A2FF; --e:#72E6AC; --y:#5EE3E0;
  --closed:#FF946E; --open:#7DE3C8; --silent:#F5C451;
  --ok:#72E6AC; --bad:#FF7E94;
  --title:'Kurale',Georgia,'Times New Roman',serif;
  --word:'Andika','Nunito','Segoe UI',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background:radial-gradient(1100px 600px at 75% -10%,#3D2B80 0,transparent 60%),radial-gradient(900px 520px at 5% 5%,#1C3A7E 0,transparent 60%),linear-gradient(180deg,#0B0E2E 0,#131647 55%,#25174E 100%);background-color:var(--night);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B0E2E}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.castle{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(1200px,100%);z-index:0;pointer-events:none;opacity:.55}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.c-a{--vc:var(--a)}.c-o{--vc:var(--o)}.c-i{--vc:var(--i)}.c-u{--vc:var(--u)}.c-e{--vc:var(--e)}.c-y{--vc:var(--y)}
.k-closed{--kc:var(--closed)}.k-open{--kc:var(--open)}.k-silent{--kc:var(--silent)}

/* top path */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,rgba(11,14,46,.92),rgba(11,14,46,.6));backdrop-filter:blur(8px)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.logo{font-family:var(--title);font-size:22px;color:var(--gold2);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.path{flex:1;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.path::-webkit-scrollbar{display:none}
.dot{flex:0 0 auto;width:14px;height:14px;border:0;padding:0;background:none;display:grid;place-items:center}
.dot i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:.3s}
.dot.done i{background:var(--gold)}
.dot.cur i{width:14px;height:14px;background:var(--gold2);box-shadow:0 0 12px var(--gold)}
.dot.ch{margin-left:8px}
.timer{display:none;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2);font-size:14px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer;white-space:nowrap}
body.teacher .timer{display:inline-block}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
body.teacher .tbtn{background:var(--gold);color:var(--night);border-color:var(--gold)}

/* stage */
main{position:relative;z-index:1;overflow-x:clip;max-width:1180px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slide{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:clamp(18px,3.4vw,40px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:22px;min-height:min(640px,calc(100vh - 210px));animation:enter .6s cubic-bezier(.2,.9,.3,1.1) both;position:relative}
.slide.back{animation-name:enterB}
@keyframes enter{from{opacity:.001;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:.001;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold)}
h1,h2,h3{font-family:var(--title);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.st{font-size:clamp(32px,5vw,54px);background:linear-gradient(180deg,#FFF6D8 0%,var(--gold) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(245,196,81,.15)}
h3{font-size:26px;color:var(--gold2)}
p{margin:0}
.muted{color:var(--muted)}
.grow{flex:1;display:flex;flex-direction:column;gap:20px;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.center{justify-content:center;text-align:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two,.three{grid-template-columns:minmax(0,1fr)}}

.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:17px;background:var(--card2);border:1px solid rgba(255,255,255,.14);transition:transform .12s, box-shadow .2s}
.btn:hover{box-shadow:0 0 0 1px var(--line),0 0 18px rgba(245,196,81,.18)}
.btn:active{transform:translateY(2px)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1C5C;border-color:transparent;box-shadow:0 6px 0 #B98A1E,0 10px 24px rgba(245,196,81,.25)}
.btn.gold:active{box-shadow:0 2px 0 #B98A1E}
.btn.ok{background:var(--ok);color:#10301F;border-color:transparent}.btn.bad{background:var(--bad);color:#3B0F1A;border-color:transparent}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:12px}
.say{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(245,196,81,.12);color:var(--gold2);display:inline-grid;place-items:center;flex:0 0 auto}
.say svg{width:22px;height:22px}

/* narrator */
.narr{display:flex;gap:14px;align-items:flex-end}
.narr svg{width:92px;height:110px;flex:0 0 auto;filter:drop-shadow(0 0 14px rgba(245,196,81,.35));animation:hover 4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.bubble{position:relative;background:var(--parch);color:var(--parch-ink);border-radius:22px;padding:14px 20px;font-size:19px;font-weight:600;max-width:70ch;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:var(--parch);border-left:0}
.bubble b{color:#7A2E8E}
.bubble .term{font-family:var(--title);font-size:1.08em;color:#8A3A00;background:#FFE3A3;border-radius:8px;padding:0 6px}

/* rule card (термин) */
.rule{border-radius:22px;padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--kc) 55%,transparent);box-shadow:inset 0 0 40px color-mix(in srgb,var(--kc) 10%,transparent)}
.rule .rt{font-family:var(--title);font-size:26px;color:var(--kc);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.rule .rt svg{width:34px;height:34px}
.rule p{font-size:18px}
.rule .img{color:var(--muted);font-size:16px;margin-top:8px;font-style:italic}

/* words */
.word{font-family:var(--word);font-weight:700;letter-spacing:.03em;display:inline-flex;align-items:baseline;white-space:nowrap}
.word .vw{color:var(--vc);text-shadow:0 0 18px color-mix(in srgb,var(--vc) 55%,transparent)}
.word .silent{color:var(--gold);opacity:.55;position:relative}
.word .silent::after{content:"";position:absolute;left:0;right:0;top:55%;border-top:3px solid var(--gold);transform:rotate(-14deg)}
.word .new{display:inline-block;animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-60deg);opacity:0}100%{transform:none;opacity:1}}
.ipa{font-family:var(--word);white-space:nowrap}

/* demo spell */
.spell{display:grid;justify-items:center;gap:18px;text-align:center}
.spell .big{font-size:clamp(72px,14vw,140px);line-height:1.05;position:relative;padding:0 10px}
.spell .ltr{display:inline-block;position:relative;transition:transform .35s,color .35s,opacity .35s}
.spell .ltr.glow{color:var(--vc);transform:translateY(-8px) scale(1.12);text-shadow:0 0 24px var(--vc)}
.spell .ltr.guard{color:var(--closed)}
.spell .ltr.guard::before{content:"";position:absolute;left:8%;right:8%;bottom:-6px;height:8px;border-radius:4px;background:var(--closed);box-shadow:0 0 14px var(--closed)}
.spell .ltr.lockv::after{content:"";position:absolute;inset:-6px -10px -14px;border:4px solid var(--closed);border-left:0;border-radius:0 30px 30px 0;opacity:.9}
.spell .ltr.rays{color:var(--vc);text-shadow:0 0 30px var(--open),0 0 60px var(--open)}
.spell .ltr.rays::after{content:"";position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;margin:-.8em;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--open) 35%,transparent),transparent 70%);z-index:-1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.spell .empty{display:inline-block;width:.6em;height:.8em;border:4px dashed var(--open);border-radius:12px;margin-left:.08em;vertical-align:-.05em;opacity:.8}
.spell .ltr.magic{color:var(--gold);opacity:.5}
.spell .ltr.magic::before{content:"";position:absolute;left:0;right:0;top:55%;border-top:5px solid var(--gold);transform:rotate(-14deg)}
.spell .msg{font-size:21px;font-weight:700;min-height:64px;max-width:40ch}
.tag{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--kc) 22%,transparent);color:var(--kc);border:1px solid color-mix(in srgb,var(--kc) 60%,transparent)}
.spk{position:absolute;width:10px;height:10px;pointer-events:none;background:var(--gold2);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .9s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}

/* vowel cards */
.gems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.gem{perspective:900px;border:0;background:none;padding:0;height:170px}
.gem .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.gem.on .in{transform:rotateY(180deg)}
.gem .f,.gem .b{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;display:grid;place-items:center;text-align:center;padding:10px}
.gem .f{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55),transparent 40%),linear-gradient(160deg,var(--vc),color-mix(in srgb,var(--vc) 55%,#1a1050));font-family:var(--word);font-weight:700;font-size:88px;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18);box-shadow:0 0 30px color-mix(in srgb,var(--vc) 45%,transparent),inset 0 -8px 0 rgba(0,0,0,.15)}
.gem .f small{position:absolute;top:10px;font-size:12px;font-family:var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:800}
.gem .b{transform:rotateY(180deg);background:var(--parch);color:var(--parch-ink);gap:2px;font-size:15px;font-weight:700;align-content:center}
.gem .b strong{font-family:var(--title);font-size:24px;font-weight:400}
.guards{display:flex;flex-wrap:wrap;gap:8px}
.guard{width:58px;height:66px;border-radius:14px 14px 8px 8px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));display:grid;place-items:center;font-family:var(--word);font-size:28px;font-weight:700;line-height:1}
.guard small{display:none;font-size:13px;font-family:var(--body);color:var(--gold2)}
.guard.show small{display:block}
.guard.pick{background:var(--gold);color:var(--night);animation:wob .5s}
@keyframes wob{30%{transform:scale(1.15) rotate(-5deg)}60%{transform:scale(.95) rotate(4deg)}}

/* voices */
.voice{border-radius:24px;padding:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.voice .vt{font-family:var(--title);font-size:24px;color:var(--gold2)}
.voice .vipa{font-size:44px;font-family:var(--word);color:var(--vc)}
.voice .word{font-size:56px}

/* reading train */
.train{display:grid;justify-items:center;gap:16px;text-align:center}
.train .big{font-size:clamp(72px,13vw,130px);line-height:1.05}
.train .info{min-height:40px;font-size:19px;font-weight:700}
.bar5{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.bar5 i{width:26px;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.bar5 i.on{background:var(--gold)}

/* sort castles */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px;padding:12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18)}
.chip{border:2px solid transparent;background:var(--parch);color:var(--parch-ink);border-radius:16px;padding:4px 16px;font-size:30px;line-height:1.25;box-shadow:0 4px 0 #CDB98A;transition:transform .15s}
.chip .word .vw{text-shadow:none;filter:brightness(.78) saturate(1.3)}
.chip.sel{transform:translateY(-6px) rotate(-3deg);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 10px 24px rgba(245,196,81,.35)}
.chip.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.castles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cst{border:1px solid color-mix(in srgb,var(--kc) 55%,transparent);border-radius:24px;background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 14%,transparent),rgba(255,255,255,.02));padding:12px;min-height:170px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:box-shadow .2s}
.cst:hover{box-shadow:0 0 24px color-mix(in srgb,var(--kc) 35%,transparent)}
.cst svg{width:70px;height:56px}
.cst .ct{font-family:var(--title);font-size:21px;color:var(--kc)}
.cst .cs{font-size:14px;color:var(--muted)}
.cst .cw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cst .cw .word{font-size:22px;background:rgba(255,255,255,.08);border-radius:10px;padding:0 10px;animation:pop .45s both}
.score{font-weight:800;font-size:16px;color:var(--muted)}
.score b{color:var(--ok)}

/* scroll / algorithm */
.scroll{background:var(--parch);color:var(--parch-ink);border-radius:20px;padding:18px 22px;position:relative;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-8px;right:-8px;height:16px;border-radius:10px;background:#E7CF95}
.scroll::before{top:-8px}.scroll::after{bottom:-8px}
.scroll ol{margin:6px 0 0;padding-left:24px;display:grid;gap:8px;font-size:18px;font-weight:600}
.scroll h3{color:#7A2E8E}
.scroll .k{font-weight:800}
.scroll .k.c{color:#B4421F}.scroll .k.o{color:#13795B}.scroll .k.s{color:#9A6A00}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.isle{border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:14px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:.25s;position:relative}
.isle .L{font-family:var(--word);font-size:64px;font-weight:700;color:var(--vc);line-height:1;text-shadow:0 0 22px color-mix(in srgb,var(--vc) 50%,transparent)}
.isle .nm{font-family:var(--title);font-size:18px}
.isle small{color:var(--muted);font-size:13px}
.isle.sel{border-color:var(--vc);background:color-mix(in srgb,var(--vc) 16%,transparent);transform:translateY(-4px)}
.isle .ord{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--vc);color:var(--night);font-weight:800;display:grid;place-items:center}
.isle.done{opacity:.85}
.isle.done .ord{background:var(--gold)}

/* vowel chapter crest */
.crest{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:700px){.crest{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.shield{width:170px;height:200px;display:grid;place-items:center;font-family:var(--word);font-size:110px;font-weight:700;color:#fff;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.5),transparent 45%),linear-gradient(160deg,var(--vc),color-mix(in srgb,var(--vc) 50%,#1a1050));clip-path:path('M85 0 L170 28 L170 100 C170 160 120 190 85 200 C50 190 0 160 0 100 L0 28 Z');filter:drop-shadow(0 0 20px var(--vc));line-height:1}
.exs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.exs{grid-template-columns:minmax(0,1fr)}}
.exc{border-radius:20px;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent);display:flex;flex-direction:column;gap:4px;min-width:0}
.exc h4{margin:0 0 4px;font-family:var(--title);font-weight:400;font-size:19px;color:var(--kc)}
.exc button{border:0;background:none;text-align:left;padding:0;font-size:30px}
.exc .none{font-size:14px;color:var(--muted)}
.warn{border-radius:16px;padding:10px 14px;background:rgba(245,196,81,.12);border:1px solid var(--line);font-size:16px}

/* games */
.imp{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.imp svg{width:110px;height:130px;flex:0 0 auto;animation:hover 3s ease-in-out infinite}
.imp .bubble{font-size:23px}
.imp .bubble .word{font-size:1.35em}
.fb{min-height:52px;border-radius:16px;padding:12px 16px;font-size:19px;font-weight:700;text-align:center}
.fb.ok{background:rgba(114,230,172,.14);color:var(--ok);border:1px solid rgba(114,230,172,.4)}
.fb.bad{background:rgba(255,126,148,.14);color:var(--bad);border:1px solid rgba(255,126,148,.4)}
.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;position:relative}
.mcard{border-radius:20px;height:100px;display:grid;place-items:center;font-size:40px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.mcard.gone{border:3px dashed var(--gold);background:rgba(245,196,81,.12)}
.curtain{position:absolute;inset:-8px;border-radius:24px;background:repeating-linear-gradient(90deg,#5B2A86 0 40px,#4A2170 40px 80px);transform-origin:top;transform:scaleY(0);transition:transform .6s cubic-bezier(.5,0,.3,1.2);display:grid;place-items:center;font-family:var(--title);font-size:34px;color:var(--gold2);box-shadow:inset 0 -14px 0 var(--gold)}
.curtain.down{transform:scaleY(1)}
.build{display:grid;gap:16px;justify-items:center;text-align:center}
.slots{display:flex;gap:8px}
.slot{width:66px;height:76px;border-radius:16px;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-family:var(--word);font-size:44px;font-weight:700}
.slot.full{border-style:solid;border-color:var(--gold);background:rgba(245,196,81,.1)}
.slot.v{color:var(--vc)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

};
const parse=s=>s?s.split(',').map(p=>{const k=p.indexOf(':');return {w:p.slice(0,k),ru:p.slice(k+1)}}):[];
const WORDS=[],RU={};
ORDER.forEach(v=>['closed','open','magic'].forEach(t=>parse(V[v][t]).forEach(o=>{WORDS.push({w:o.w,ru:o.ru,v,t});RU[o.w.toLowerCase()]=o.ru})));
Object.assign(RU,{pan:'сковорода',set:'набор',in:'в',side:'сторона',take:'брать',cupcake:'кекс',pancake:'блинчик',hotdog:'хот-дог',sunset:'закат',inside:'внутри',mistake:'ошибка',bedtime:'время сна',pinecone:'шишка',dustpan:'совок',cone:'шишка',dust:'пыль'});
function classify(s){const l=s.toLowerCase();
  if(/^[^aeiou]*y$/.test(l))return {v:'y',t:'open'};
  const m=l.match(/([aeiou])[^aeiou]+e$/);
  if(m&&l.length>=3&&!/[aeiou]/.test(l.slice(0,m.index)))return {v:m[1],t:'magic'};
  if(/[aeiou]$/.test(l))return {v:l.match(/[aeiou]/)[0],t:'open'};
  const vs=l.match(/[aeiou]/);return {v:vs?vs[0]:'a',t:'closed'};}
const W=s=>Object.assign({w:s,ru:RU[s.toLowerCase()]||''},classify(s));
const snd=w=>w.v==='y'?'/aɪ/':(w.t==='closed'?V[w.v].short:V[w.v].name);
const K={closed:{n:'Закрытый слог',k:'closed',say:'читается коротко'},open:{n:'Открытый слог',k:'open',say:'читается как в алфавите'},magic:{n:'Немая e',k:'silent',say:'читается как в алфавите'}};
function vIndex(w){const s=w.w.toLowerCase();if(w.v==='y')return s.lastIndexOf('y');if(w.t==='magic')return s.slice(0,-1).lastIndexOf(w.v);return s.indexOf(w.v)}
function wordHTML(w,o){o=o||{};const vi=vIndex(w),s=w.w;let h='';
  for(let k=0;k<s.length;k++){let c='ltr';if(k===vi&&!o.plain)c+=' vw';if(w.t==='magic'&&k===s.length-1&&!o.plain)c+=' silent';if(o.newFrom!=null&&k>=o.newFrom)c+=' new';h+=`<span class="${c}" data-k="${k}">${s[k]}</span>`}
  return `<span class="word c-${w.v}">${h}</span>`}

/* ================= FX ================= */
const canSpeak='speechSynthesis' in window;let voice=null;
function loadVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Aria|Jenny/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/.test(v.lang))||null}catch(e){}}
if(canSpeak){loadVoice();try{speechSynthesis.onvoiceschanged=loadVoice}catch(e){}}
function say(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.75;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
const SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const sayBtn=t=>canSpeak?`<button class="say" data-say="${t}" aria-label="Послушать ${t}">${SPK}</button>`:'';
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});

const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],raf=0;
const st=$('#stars'),sctx=st.getContext('2d');let stars=[];
function size(){const d=devicePixelRatio;fx.width=st.width=innerWidth*d;fx.height=st.height=innerHeight*d;
  stars=Array.from({length:Math.round(innerWidth*innerHeight/7000)},()=>({x:Math.random()*st.width,y:Math.random()*st.height*.8,r:(Math.random()*1.4+.3)*d,p:Math.random()*6.28,s:.01+Math.random()*.03}));drawStars(0)}
function drawStars(t){sctx.clearRect(0,0,st.width,st.height);stars.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(s.p+t*s.s));sctx.globalAlpha=a;sctx.fillStyle='#FFF4D0';sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,6.28);sctx.fill()});sctx.globalAlpha=1}
let tt=0;function starLoop(){tt++;drawStars(tt);requestAnimationFrame(starLoop)}
size();addEventListener('resize',size);if(!reduce)requestAnimationFrame(starLoop);
function confetti(x,y,n){if(reduce)return;n=n||60;const d=devicePixelRatio;const cols=['#FF7E94','#FFB65C','#86B6FF','#C9A2FF','#72E6AC','#5EE3E0','#F5C451','#FFE6A0'];
  for(let k=0;k<n;k++)parts.push({x:x*d,y:y*d,vx:(Math.random()-.5)*14*d,vy:(-Math.random()*12-4)*d,r:(Math.random()*5+4)*d,c:pick(cols),a:Math.random()*6,l:1,star:Math.random()<.5});
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.vy+=.42*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.a+=.18;p.l-=.013;fctx.save();fctx.globalAlpha=Math.max(p.l,0);fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;
    if(p.star){fctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?p.r*.4:p.r;const an=i*Math.PI/4;fctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}fctx.fill()}else fctx.fillRect(-p.r,-p.r/3,p.r*2,p.r*.66);fctx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0}
const center=el=>{if(!el)return [innerWidth/2,innerHeight/2];const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]};
function sparkle(el){if(reduce||!el)return;for(let k=0;k<18;k++){const s=document.createElement('i');s.className='spk';const a=Math.random()*6.28,d=70+Math.random()*80;s.style.cssText=`left:50%;top:45%;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;el.appendChild(s);setTimeout(()=>s.remove(),950)}}

/* ================= COMPONENTS ================= */
// spell demo: walks a word through stages
function spellDemo(root,list){
  let k=0,stage=0;
  function draw(){const w=W(list[k]);const vi=vIndex(w),s=w.w;const kk=K[w.t];
    const msgs=[`Прочитай слово. Где здесь гласная?`,
      `Гласная — <b style="color:var(--vc)" class="c-${w.v}">${s[vi].toUpperCase()}</b>. Посмотри, кто стоит после неё.`,
      w.t==='closed'?`После неё согласная <b style="color:var(--closed)">${s.slice(vi+1)}</b> — она закрыла гласную.`:w.t==='open'?`После неё <b style="color:var(--open)">никого нет</b> — гласная свободна!`:`После согласной стоит <b style="color:var(--gold)">e</b>. Она молчит, но открывает слог.`,
      `${kk.n}: ${s[vi].toUpperCase()} ${kk.say} <span class="ipa">${snd(w)}</span>`];
    let h='';for(let i=0;i<s.length;i++){let c='ltr';
      if(stage>=1&&i===vi)c+=' glow';
      if(stage>=2){if(w.t==='closed'&&i>vi){c+=' guard'}if(w.t==='closed'&&i===vi)c+=' lockv';if(w.t==='open'&&i===vi)c+=' rays';if(w.t==='magic'&&i===s.length-1)c+=' magic';if(w.t==='magic'&&i===vi)c+=' rays'}
      h+=`<span class="${c}">${s[i]}</span>`}
    if(stage>=2&&w.t==='open')h+='<span class="empty"></span>';
    root.innerHTML=`<div class="spell"><div class="big c-${w.v}" id="spBig">${h}</div><div class="msg">${msgs[stage]}</div>
     ${stage===3?`<div class="row center"><span class="tag k-${kk.k}">${ICONS[kk.k].replace('<svg','<svg width="22" height="22"')}${kk.n}</span>${sayBtn(s)}<span class="muted">${w.ru}</span></div>`:''}
     <div class="row center"><button class="btn gold" data-sp>${['Найти гласную','Кто после неё?','Как читаем?',k<list.length-1?'Следующее слово →':'Ещё раз'][stage]}</button><span class="muted" style="font-size:14px">${k+1} / ${list.length}</span></div></div>`;
    root.querySelector('[data-sp]').onclick=()=>{if(stage<3){stage++;draw();if(stage===2)sparkle($('#spBig'));if(stage===3){say(s);confetti(...center($('#spBig')),30)}}else{k=(k+1)%list.length;stage=0;draw()}};
  }
  draw();
}
// reading train
function train(root,list){let k=0,shown=false;
  function draw(){const w=W(list[k]);
    root.innerHTML=`<div class="train"><div class="bar5">${list.map((_,i)=>`<i class="${i<=k?'on':''}"></i>`).join('')}</div>
      <div class="big">${wordHTML(w,{plain:!shown})}</div>
      <div class="info">${shown?`<span class="tag k-${K[w.t].k}">${K[w.t].n}</span> <span class="c-${w.v}"><span class="ipa" style="color:var(--vc)">${snd(w)}</span></span> · <span class="muted">${w.ru}</span>`:'Прочитай вслух!'}</div>
      <div class="row center"><button class="btn" data-sh>${shown?'Спрятать подсказку':'Проверить'}</button>${sayBtn(w.w)}<button class="btn gold" data-nx>${k<list.length-1?'Следующее →':'Сначала'}</button></div></div>`;
    root.querySelector('[data-sh]').onclick=()=>{shown=!shown;draw();if(shown)say(w.w)};
    root.querySelector('[data-nx]').onclick=()=>{if(k===list.length-1){confetti(...center(root),80);k=0}else k++;shown=false;draw()};}
  draw()}
// wand pairs
function wand(root,v){const d=V[v];const pairs=d.pairs.split(',').map(p=>p.split('-'));let k=0,on=false;
  function draw(anim){const [a,b]=pairs[k];const s=on?b:a;const w=W(s);let pre=0;while(pre<a.length&&pre<b.length&&a[pre]===b[pre])pre++;
    root.innerHTML=`<div class="spell c-${v}"><div class="big" id="wd">${wordHTML(w,anim?{newFrom:pre}:{})}</div>
     <div class="row center"><span class="tag k-${K[w.t].k}">${K[w.t].n}</span><span class="ipa" style="font-size:24px;color:var(--vc)">${snd(w)}</span><span class="muted">${w.ru}</span></div>
     <div class="row center"><button class="btn gold" data-w>${d.door?(on?'Вернуть согласную':'Убрать согласную'):(on?'Убрать e':'Взмахнуть палочкой')}</button>${sayBtn(s)}<button class="btn" data-n>Следующая пара →</button><span class="muted" style="font-size:14px">${k+1}/${pairs.length}</span></div></div>`;
    root.querySelector('[data-w]').onclick=()=>{on=!on;draw(true);sparkle($('#wd'));say(on?b:a)};
    root.querySelector('[data-n]').onclick=()=>{k=(k+1)%pairs.length;on=false;draw()};}
  draw()}
// sort into castles
function sortCastles(root,words,src){
  const types=['closed','open','magic'].filter(t=>words.some(w=>w.t===t));
  const s={left:words.slice(),placed:{closed:[],open:[],magic:[]},sel:null,ok:0,miss:0};
  const sub={closed:'коротко',open:'как в алфавите',magic:'как в алфавите, e молчит'};
  function draw(){root.innerHTML=`<div class="grow" style="gap:16px"><div class="pool">${s.left.map((w,k)=>`<button class="chip ${s.sel===k?'sel':''}" data-ch="${k}">${wordHTML(w)}</button>`).join('')||'<span style="font-family:var(--title);font-size:24px;color:var(--gold2)">Все слова нашли свой замок!</span>'}</div>
    <div class="castles">${types.map(t=>`<button class="cst k-${K[t].k}" data-bin="${t}">${CASTLE_ICON}<span class="ct">${K[t].n}</span><span class="cs">${sub[t]}</span><span class="cw">${s.placed[t].map(w=>`<span class="word c-${w.v}">${w.w}</span>`).join('')}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><span class="score">Верно: <b>${s.ok}</b> · Ошибок: ${s.miss}</span><button class="btn sm" data-rs>Новые слова</button></div></div>`}
  root.onclick=e=>{const ch=e.target.closest('[data-ch]');if(ch){s.sel=+ch.dataset.ch;draw();say(s.left[s.sel].w);return}
    const bin=e.target.closest('[data-bin]');
    if(bin&&s.sel!=null){const w=s.left[s.sel],t=bin.dataset.bin;
      if(w.t===t){s.ok++;s.left.splice(s.sel,1);s.placed[t].push(w);s.sel=null;draw();confetti(...center(root.querySelector(`[data-bin="${t}"]`)),s.left.length?24:100)}
      else{s.miss++;const c=root.querySelector(`[data-ch="${s.sel}"]`);c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');setTimeout(()=>{s.sel=null;draw()},450)}return}
    if(e.target.closest('[data-rs]'))sortCastles(root,src(),src)};
  draw()}


const MULTI={

  ...mk('gem:драгоценный камень,gel:гель,age:возраст,cage:клетка,page:страница,stage:сцена,huge:огромный','dj','g')];
const CATS={
 j:{n:'Y-согласная',snd:'«й»',ipa:'/j/',col:'#72E6AC',where:'в начале слова'},
 ai:{n:'Y = «ай»',snd:'«ай»',ipa:'/aɪ/',col:'#86B6FF',where:'на конце, других гласных нет'},
 i:{n:'Y = «и»',snd:'«и»',ipa:'/i/',col:'#FF9FD0',where:'на конце, есть ещё гласная'},
 k:{n:'C = «к»',snd:'«к»',ipa:'/k/',col:'#FFB65C',where:'после неё a, o, u, согласная или конец'},
 s:{n:'C = «с»',snd:'«с»',ipa:'/s/',col:'#5EE3E0',where:'после неё e, i или y'},
 g:{n:'G = «г»',snd:'«г»',ipa:'/g/',col:'#FFB65C',where:'после неё a, o, u, согласная или конец'},
 dj:{n:'G = «дж»',snd:'«дж»',ipa:'/dʒ/',col:'#C9A2FF',where:'после неё e, i или y'}};
const plain=it=>it.w.replace('|','');
function tIdx(it){const s=plain(it);if(it.L==='y')return s[0]==='y'?0:s.lastIndexOf('y');return s.indexOf(it.L)}
function why(it){const s=plain(it),t=tIdx(it),nx=s[t+1];const c=CATS[it.cat];
  if(it.cat==='j')return 'Y стоит <b>в начале слова</b> — значит, это согласная. Говорит «й».';
  if(it.cat==='ai')return 'Y на конце, а <b>других гласных в слове нет</b>. Один слог — Y говорит «ай», как I в алфавите.';
  if(it.cat==='i'){const v=[...s.slice(0,-1)].find(ch=>'aeiou'.includes(ch));return `Y на конце, и в слове есть <b>ещё гласная — ${v.toUpperCase()}</b>. Значит, слогов два: <b>${it.w}</b>. Y говорит «и».`}
  const L=it.L.toUpperCase();
  if(it.cat==='s'||it.cat==='dj')return `После ${L} стоит <b>${nx.toUpperCase()}</b> — волшебная соседка. ${L} говорит ${c.snd}.`;
  return nx?`После ${L} стоит <b>${nx.toUpperCase()}</b> — это не E, не I и не Y. ${L} говорит ${c.snd}.`:`${L} стоит <b>в конце слова</b>, соседки нет. ${L} говорит ${c.snd}.`}
function lw(it,o){o=o||{};const s=plain(it),t=tIdx(it),sp=it.w.indexOf('|');const col=CATS[it.cat].col;let h='';
  for(let i=0;i<s.length;i++){if(o.split&&sp>0&&i===sp)h+='<i class="lsep">|</i>';let c='';
    if(o.hl&&i===t)c='t';if(o.nb&&it.L!=='y'&&i===t+1)c='nb';if(o.nb&&it.L==='y'&&it.cat==='i'&&i<t&&'aeiou'.includes(s[i]))c='nb';
    h+=`<span class="${c}">${s[i]}</span>`}
  return `<span class="lw ${o.col?'on':''}" style="--cc:${col}">${h}</span>`}
const tagC=k=>`<span class="ctag" style="--cc:${CATS[k].col}">${CATS[k].n}</span>`;

function chDiag(root){const list=R([...R(YW).slice(0,4),...R(CW).slice(0,3),...R(GW).slice(0,3)]);const rev=R(WORDS.filter(w=>LV.includes(w.v)&&good(w))).slice(0,2).map(w=>({w:w.w,ru:w.ru,rev:true,wo:w}));const all=R([...list,...rev]);

  const draw=()=>{const pr=`<div class="prog">${all.map((_,i)=>`<i class="${marks[i]||(i===k?'cur':'')}"></i>`).join('')}</div>`;
    if(k<all.length){const it=all[k];root.innerHTML=`<div class="diag">${pr}<div class="eyebrow">Слово ${k+1} из ${all.length}</div><div class="big lbig">${it.rev?`<span class="word">${it.w}</span>`:lw(it)}</div>

      <div class="row center"><button class="btn ok" data-m="ok">Прочитала</button><button class="btn gold" data-m="mid">С подсказкой</button><button class="btn bad" data-m="bad">Ошибка</button>${sayBtn(plain(it))}</div></div>`;
      $$('[data-m]',root).forEach(b=>b.onclick=()=>{marks[k]=b.dataset.m;k++;if(b.dataset.m==='ok')confetti(...center(b),18);draw()});return}
    const grp=it=>it.rev?'Слоги (повторение)':it.L==='y'?'Хамелеон Y':'Буквы C и G';const rows={};
    all.forEach((it,i)=>{const g=grp(it);const r=rows[g]||(rows[g]={ok:0,n:0,bad:[]});if(marks[i]==='ok')r.ok++;else r.bad.push(plain(it));r.n++});

const memoCham=()=>{let h='';
  if(HAS('y'))h+=`<div class="memo"><h3>Хамелеон Y</h3>
   <div class="mrow">${chameleon('#72E6AC').replace('class="cham"','class="cham mini"')}<span><b>В начале слова</b> — «й»: <span class="lw on" style="--cc:#72E6AC"><span class="t">y</span>es</span> ${sayBtn('yes')}</span></div>
   <div class="mrow">${chameleon('#86B6FF').replace('class="cham"','class="cham mini"')}<span><b>На конце, других гласных нет</b> — «ай»: <span class="lw on" style="--cc:#3F6FD8">m<span class="t">y</span></span> ${sayBtn('my')}</span></div>
   <div class="mrow">${chameleon('#FF9FD0').replace('class="cham"','class="cham mini"')}<span><b>На конце, есть ещё гласная</b> — «и»: <span class="lw on" style="--cc:#C2357A">hap<i class="lsep">|</i>p<span class="t">y</span></span> ${sayBtn('happy')}</span></div></div>`;
  if(HAS('c')||HAS('g'))h+=`<div class="memo"><h3>${HAS('c')&&HAS('g')?'Буквы C и G':HAS('c')?'Буква C':'Буква G'}</h3>
   <div class="mrow k-silent">${ICONS.silent}<span>После них стоит <b>E, I или Y</b> — волшебная соседка: ${HAS('c')?'C говорит «с» (<b>ice</b>, <b>pencil</b>)':''}${HAS('c')&&HAS('g')?', ':''}${HAS('g')?'G говорит «дж» (<b>page</b>, <b>gem</b>)':''}.</span></div>
   <div class="mrow k-closed">${ICONS.closed}<span>Любая другая буква или конец слова: ${HAS('c')?'C — «к» (<b>cat</b>, <b>crab</b>)':''}${HAS('c')&&HAS('g')?', ':''}${HAS('g')?'G — «г» (<b>dog</b>, <b>glad</b>)':''}.</span></div>
   ${HAS('g')?'<div class="mrow"><span><b style="color:#FF7E94">Хулиганы:</b> get, gift — G здесь «г», просто запоминаем.</span></div>':''}</div>`;
  return h};
const NAMES={t1:'Какой слог?',t3:'Найди лишнее',t4:'Великаны',ty:'Хамелеон Y',tcg:CFG.cham.includes('c')&&CFG.cham.includes('g')?'Буквы C и G':CFG.cham.includes('c')?'Буква C':'Буква G',t5:'Читаем вслух'};
const TL=[];
TL.push({id:'intro',ch:'Памятка',r:el=>{el.classList.add('cover');el.innerHTML=`
  <svg class="crown" viewBox="0 0 120 90"><path d="M8 80 16 24l26 26 18-40 18 40 26-26 8 56z" fill="#F5C451"/><circle cx="16" cy="22" r="6" fill="#FF7E94"/><circle cx="60" cy="8" r="7" fill="#86B6FF"/><circle cx="104" cy="22" r="6" fill="#72E6AC"/><rect x="8" y="76" width="104" height="10" rx="4" fill="#E2A92A"/></svg>
  <div class="eyebrow">Домашнее задание</div><h1>Свиток: ${CFG.name}</h1>
  <p class="lead">${CFG.name}, фея оставила тебе ${TL_COUNT} испытаний. Сначала посмотри памятку, потом пройди все задания и собери звёзды!</p>
  <div class="memogrid"><div class="memo"><h3>Слоги</h3>
   <div class="mrow k-closed">${ICONS.closed}<span><b>Закрытый слог</b> кончается на согласную → гласная коротко: <span class="word c-a">c<span class="vw">a</span>t</span> ${sayBtn('cat')}</span></div>
   <div class="mrow k-open">${ICONS.open}<span><b>Открытый слог</b> кончается на гласную → как в алфавите: <span class="word c-o">g<span class="vw">o</span></span> ${sayBtn('go')}</span></div>
   <div class="mrow k-silent">${ICONS.silent}<span><b>Немая e</b> молчит → гласная как в алфавите: <span class="word c-i">k<span class="vw">i</span>t<span class="silent">e</span></span> ${sayBtn('kite')}</span></div>
   <div class="mrow k-cut">${ICONS.silent}<span><b>Длинное слово</b>: сколько гласных — столько слогов. Две согласные — режем между ними (nap|kin), одна — перед ней (ro|bot).</span></div></div>
   ${memoCham()}</div>
  <div class="parents"><b>Для родителей.</b> 10–15 минут, можно разбить на два дня: прогресс сохраняется на этом устройстве. Ребёнок делает задания сам, ответы проверяются автоматически. Помощь нужна только в последнем задании: ребёнок читает вслух, а вы отмечаете «прочитала сама» или «было трудно». Кнопка с динамиком озвучивает слово компьютерным голосом — это подсказка, а не эталон. В конце нажмите «Скопировать результат» и отправьте учителю.</div>
  <button class="btn gold" data-go-next style="font-size:20px;padding:14px 30px">Начать!</button>`}});
TL.push({id:'t1',ch:'Слоги',r:el=>{el.innerHTML=`<div><div class="eyebrow">Испытание · слоги</div><h2 class="st">Какой это слог?</h2></div>${narr('Посмотри на конец слова: согласная — закрытый слог, гласная — открытый, молчит e на конце — немая e.')}<div id="q" class="grow"></div>`;t1($('#q',el))}});
TL.push({id:'t3',ch:'Лишнее',r:el=>{el.innerHTML=`<div><div class="eyebrow">Испытание · слоги</div><h2 class="st">Найди лишнее</h2></div>${narr('В трёх словах гласная звучит одинаково, а в одном — по-другому. Найди его!','#86B6FF','#FFB65C')}<div id="q" class="grow"></div>`;t3($('#q',el))}});
TL.push({id:'t4',ch:'Великаны',r:el=>{el.innerHTML=`<div><div class="eyebrow">Испытание · длинные слова</div><h2 class="st">Разрежь великана</h2></div>${narr('Сначала разрежь слово на слоги, потом скажи, какой каждый слог.','#C9A2FF','#72E6AC')}<div id="q" class="grow"></div>`;t4($('#q',el))}});
if(HAS('y'))TL.push({id:'ty',ch:'Хамелеон Y',r:el=>{el.innerHTML=`<div><div class="eyebrow">Испытание · хамелеон Y</div><h2 class="st">Рассади хамелеонов</h2></div>${narr('Нажми на слово, прочитай его и отправь к хамелеону нужного цвета. Помни: где сидит Y и есть ли ещё гласная?','#72E6AC','#86B6FF')}<div id="q" class="grow"></div>`;
  hwSort($('#q',el),'ty',shuffle([...shuffle(YW.filter(x=>x.cat==='j')).slice(0,3),...shuffle(YW.filter(x=>x.cat==='ai')).slice(0,3),...shuffle(YW.filter(x=>x.cat==='i')).slice(0,3)]),['j','ai','i'])}});
if(HAS('c')||HAS('g'))TL.push({id:'tcg',ch:NAMES.tcg,r:el=>{const keys=[...(HAS('c')?['k','s']:[]),...(HAS('g')?['g','dj']:[])];
  el.innerHTML=`<div><div class="eyebrow">Испытание · ${NAMES.tcg}</div><h2 class="st">Кто перекрасил букву?</h2></div>${narr('Смотри на соседку справа. E, I или Y — волшебная соседка, она меняет голос буквы!','#5EE3E0','#86B6FF')}<div id="q" class="grow"></div>`;
  const it=[...(HAS('c')?[...shuffle(CW.filter(x=>x.cat==='k')).slice(0,3),...shuffle(CW.filter(x=>x.cat==='s')).slice(0,3)]:[]),...(HAS('g')?[...shuffle(GW.filter(x=>x.cat==='g')).slice(0,3),...shuffle(GW.filter(x=>x.cat==='dj')).slice(0,3)]:[])];
  hwSort($('#q',el),'tcg',shuffle(it),keys)}});
TL.push({id:'t5',ch:'Читаем',r:el=>{el.innerHTML=`<div><div class="eyebrow">Последнее испытание · вместе со взрослым</div><h2 class="st">Читаем вслух</h2></div>${narr('Прочитай каждое слово вслух. Подсказку открывай, только если совсем не получается.','#72E6AC','#FFB65C')}<div id="q" class="grow"></div>`;readAloud($('#q',el),'t5',readList5())}});
const TL_COUNT=TL.length-1;
TL.push({id:'report',ch:'Итог',r:el=>{const ids=TL.map(x=>x.id).filter(i=>NAMES[i]);const done=ids.filter(i=>RES[i]);const tot=done.reduce((a,i)=>a+RES[i].ok,0),all=done.reduce((a,i)=>a+RES[i].all,0);const miss=[...new Set(done.flatMap(i=>RES[i].miss||[]))];
  const text=`ДЗ «Свиток: ${CFG.name}»\n`+ids.map(i=>`${NAMES[i]}: ${RES[i]?RES[i].ok+' из '+RES[i].all:'не сделано'}`).join('\n')+`\nВсего: ${tot} из ${all}`+(miss.length?`\nОшибки: ${miss.join(', ')}`:'');
  el.innerHTML=`<div><div class="eyebrow">Итог</div><h2 class="st">${done.length===ids.length?'Все испытания пройдены!':'Почти всё!'}</h2></div>
   <div class="rep">${ids.map(i=>{const r=RES[i];const st=!r?0:r.ok/r.all>=.9?3:r.ok/r.all>=.7?2:1;const n=TL.findIndex(x=>x.id===i);return `<button class="repc ${r?'':'todo'}" data-jump="${n}"><span class="rn">${NAMES[i]}</span><span class="stars sm">${stars3(st)}</span><span class="muted">${r?r.ok+' из '+r.all:'ещё не сделано — нажми'}</span></button>`}).join('')}</div>
   ${miss.length?`<div class="warn"><b>Повторить:</b> ${miss.join(', ')}</div>`:''}
   <div class="row center"><button class="btn gold" data-cp>Скопировать результат для учителя</button><button class="btn" data-rs>Начать всё заново</button></div><pre class="hw" id="rt">${text}</pre>`;
  if(done.length===ids.length)setTimeout(()=>confetti(innerWidth/2,innerHeight/3,160),300);
  $$('[data-jump]',el).forEach(b=>b.onclick=()=>go(+b.dataset.jump));$('[data-rs]',el).onclick=()=>{RES={};saveRes();go(0)};
  $('[data-cp]',el).onclick=e=>{const b=e.currentTarget;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#rt',el));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Текст выделен — скопируйте его'};
    try{navigator.clipboard.writeText(text).then(()=>{b.textContent='Скопировано!';setTimeout(()=>b.textContent='Скопировать результат для учителя',1800)},sel)}catch(x){sel()}}}});
const SLIDES=TL;
let idx=Math.min(store.get('hw2_idx',0),SLIDES.length-1),dir=1;
function render(){const s=SLIDES[idx];store.set('hw2_idx',idx);const el=document.createElement('section');el.className='slide'+(dir<0?' back':'');el.setAttribute('aria-label',s.ch);
  const stage=$('#stage');stage.innerHTML='';stage.appendChild(el);s.r(el);const n=$('[data-go-next]',el);if(n)n.onclick=()=>go(idx+1);paintPath();scrollTo({top:0,behavior:'auto'})}
function paintPath(){$('#path').innerHTML=SLIDES.map((x,i)=>`<button class="dot ${RES[x.id]?'done':''} ${i===idx?'cur':''}" data-i="${i}" title="${x.ch}"><i></i></button>`).join('');
  $('#cnt').textContent=SLIDES[idx].ch;$('#prev').style.opacity=idx===0?.4:1;$('#next').style.opacity=idx===SLIDES.length-1?.4:1;$('#prev').disabled=idx===0;$('#next').disabled=idx===SLIDES.length-1}
function go(i){if(i<0||i>=SLIDES.length)return;dir=i>=idx?1:-1;idx=i;if(canSpeak)try{speechSynthesis.cancel()}catch(e){}render()}
$('#prev').onclick=()=>go(idx-1);$('#next').onclick=()=>go(idx+1);
$('#path').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1)});
render();
})();
</script>
</body></html>
