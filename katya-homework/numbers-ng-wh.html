function sectionIntro(c){if(c===0)return `<div class="rule"><strong>Числа 13–19</strong> чаще всего заканчиваются на <strong>-teen</strong>: thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen.<br><strong>Десятки</strong> — на <strong>-ty</strong>: twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety.<br><b>Не путай!</b> thirteen (13) и thirty (30). Особые написания: forty (40), fifteen (15), fifty (50).</div><div class="samplegrid"><div class="sample"><strong>13</strong><small>thirteen</small></div><div class="sample"><strong>30</strong><small>thirty</small></div><div class="sample"><strong>47</strong><small>forty-seven</small></div></div><button class="button secondary" onclick="speak('thirteen, thirty. fourteen, forty. fifteen, fifty.')">🔊 Сравнить пары</button>`;

if(c===2)return `<div class="rule"><strong>thousand = тысяча.</strong> В точных числах не добавляем -s: three thousand.<br>Делим число на части: <b>5 318</b> = 5000 + 300 + 18 = <b>five thousand three hundred and eighteen</b>.<br>А 1 025 = <b>one thousand and twenty-five</b>.</div><div class="samplegrid"><div class="sample"><strong>1 000</strong><small>one thousand</small></div><div class="sample"><strong>2 400</strong><small>two thousand four hundred</small></div><div class="sample"><strong>5 318</strong><small>five thousand three hundred and eighteen</small></div></div><button class="button secondary" onclick="speak('one thousand. two thousand four hundred. five thousand three hundred and eighteen.')">🔊 Послушать</button>`;
if(c===3)return `<div class="rule">Буквы <strong>NG</strong> в конце слов <b>sing, ring, song, king, long</b> обычно дают <strong>один носовой звук /ŋ/</strong>.<br>Задняя часть языка касается нёба, воздух проходит через нос. Отдельное «г» не произносим. Сначала послушай, затем повтори.</div><div class="samplegrid"><div class="sample"><strong>💍 ring</strong><small>кольцо</small></div><div class="sample"><strong>🎵 song</strong><small>песня</small></div><div class="sample"><strong>👑 king</strong><small>король</small></div></div><button class="button secondary" onclick="speak('sing, ring, song, king, long')">🔊 Послушать слова</button>`;
if(c===4)return `<div class="rule">Буквы <strong>WH</strong> в <b>what, when, where, white, whale, wheel</b> обычно звучат как английское <strong>/w/</strong>. Губы округляются, затем быстро раскрываются.<br>Особый случай: <b>who</b> читается с <strong>/h/</strong> — пока просто запомним как исключение.</div><div class="samplegrid"><div class="sample"><strong>🐋 whale</strong><small>кит</small></div><div class="sample"><strong>⚪ white</strong><small>белый</small></div><div class="sample"><strong>❔ what</strong><small>что</small></div></div><button class="button secondary" onclick="speak('what, when, where, white, whale, wheel, who')">🔊 Послушать слова</button>`;
return `<div class="rule">Ты уже познакомилась со всеми темами. Теперь пять разных заданий вперемешку: числа, <strong>NG</strong> и <strong>WH</strong>. Не торопись, читай вслух!</div>`}
function goto(n){step=n;answered=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(step===-1){root.innerHTML=`<section class="cover"><div><div class="eyebrow">Волшебная домашка · 2 класс</div><h1>Катя и секреты чисел ✨</h1><p>Отгадай, чем отличаются <b>-teen</b> и <b>-ty</b>, открой замок сотен и башню тысяч, а затем освой секреты звуков <b>NG</b> и <b>WH</b>. В каждом испытании есть подсказка!</p><span class="pill">53 задания</span><span class="pill">35–45 минут по частям</span><span class="pill">Озвучка</span><p><button class="button" onclick="goto(0)">Начать приключение ✨</button></p></div><div class="art">🧚‍♀️🔢🏰</div></section><div class="map">${chapters.map(x=>`<div class="mapcard"><div class="emoji">${x.icon}</div><b>${x.name}</b><small>${x.tag}</small></div>`).join('')}</div>`;return}
if(step===questions.length){root.innerHTML=`<section class="task finish"><div class="trophy">🏆🎉</div><div class="eyebrow">Приключение завершено!</div><h2>Катя, ты волшебница чисел!</h2><p>Пройдено: <strong>${questions.length}</strong> заданий. Звёздочек: <strong>${stars}</strong>. Попыток с ошибкой: <strong>${errors}</strong>.</p><p>Важно не количество ошибок, а то, сколько нового ты научилась читать!</p><div class="actions" style="justify-content:center"><button class="button secondary" onclick="copyResult()">📋 Скопировать результат</button><button class="button" onclick="restart()">Ещё раз ✨</button></div><p id="copied"></p></section>`;return}
let q=questions[step],prev=step?questions[step-1]:null;let intro=!prev||prev.stage!==q.stage;
if(intro&&!already.has(step)){root.innerHTML=`<section class="task"><div class="eyebrow">${chapters[q.stage].icon} Новая глава</div><h2>${chapters[q.stage].name}</h2><p>${chapters[q.stage].help}</p>${sectionIntro(q.stage)}<div class="actions"><button class="button secondary" onclick="goto(${Math.max(-1,step-1)})">← Назад</button><button class="button" onclick="already.add(${step});save();render()">К заданиям →</button></div></section>`;return}
let display=q.symbol?`<div class="mainword">${q.symbol}</div>`:'',sub=q.sub?`<p class="sub">${q.sub}</p>`:'';
root.innerHTML=`<section class="task"><div class="minor">${chapters[q.stage].icon} ${chapters[q.stage].name} · Задание ${step+1}/${questions.length}</div><div class="bar"><span style="width:${step/questions.length*100}%"></span></div><h2>${q.type==='listen'?'Слушай и выбирай':q.type==='picture'?'Читаем с картинками':q.type==='letters'?'Пропавшие буквы':q.type==='write'?'Пишем самостоятельно':'Волшебная проверка'}</h2><div class="prompt">${q.prompt}</div>${display}${sub}${q.speak?`<p style="text-align:center"><button class="button secondary" onclick="speak(questions[${step}].speak)">🔊 Послушать</button></p>`:''}${q.type==='write'?`<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px 0"><input id="written" autocomplete="off" style="padding:15px;border:2px solid #cbb3e4;border-radius:14px;font:inherit;min-width:240px;max-width:100%;flex:1" placeholder="Напиши ответ" onkeydown="if(event.key==='Enter')checkWritten()"><button class="button secondary" onclick="checkWritten()">Проверить ✏️</button></div>`:`<div class="options">${q.options.map((o,i)=>`<button class="choice" onclick="pick(${i})">${o}</button>`).join('')}</div>`}<div id="status" class="status">🌷 Выбери ответ. Ошибаться можно!</div><div class="actions"><button class="button secondary" onclick="goto(${Math.max(-1,step-1)})">← Назад</button><button class="button" id="next" disabled onclick="goto(${step+1})">Дальше →</button></div></section>`}
function pick(i){if(answered)return;let q=questions[step],b=[...document.querySelectorAll('.choice')],status=document.getElementById('status');if(i===q.answer){answered=true;if(!completed.has(step)){stars++;completed.add(step)}b.forEach((e,j)=>{e.disabled=true;if(j===i)e.classList.add('right')});status.className='status good';status.textContent='🌟 Верно! '+q.options[q.answer];document.getElementById('next').disabled=false;save()}else{errors++;b[i].classList.add('wrong');status.className='status bad';status.textContent='💗 Попробуй ещё. '+q.hint;save();setTimeout(()=>{if(!answered)b[i]?.classList.remove('wrong')},850)}}
function checkWritten(){if(answered)return;let q=questions[step],input=document.getElementById('written'),v=input.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/[-–]/g,'-');let expected=q.options[q.answer].toLowerCase();let status=document.getElementById('status');if(v===expected){answered=true;if(!completed.has(step)){stars++;completed.add(step)}input.disabled=true;status.className='status good';status.textContent='🌟 Верно! '+expected;document.getElementById('next').disabled=false;save()}else{errors++;status.className='status bad';status.textContent='💗 Попробуй ещё. '+q.hint;save()}}
function restart(){step=-1;stars=errors=0;already.clear();completed.clear();save();render()}
function copyResult(){let txt=`Катя — домашка: teen/ty, сотни, тысячи, NG, WH\nЗаданий: ${questions.length}\nЗвёзд: ${stars}\nОшибочных попыток: ${errors}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>document.getElementById('copied').textContent='Скопировано!').catch(()=>document.getElementById('copied').textContent=txt);else document.getElementById('copied').textContent=txt}
render();</script></body></html>
