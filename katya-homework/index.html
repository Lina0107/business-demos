<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Катя и три волшебных ключа ✨</title><meta name="theme-color" content="#33265e"><style>

ize:clamp(39px,6vw,70px);color:#ffebb3;text-shadow:0 7px 30px #ffc77740}h2{font-size:clamp(32px,5vw,49px);color:#ffe3a4}p{margin:0 0 16px}.lead{font-size:20px;color:#eee7ff}.heroart{width:100%;max-width:470px;justify-self:center;filter:drop-shadow(0 18px 36px #05031a77);animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-13px)}}.btn{border:0;cursor:pointer;border-radius:17px;padding:13px 24px;background:linear-gradient(135deg,#ffe7a1,#f4bc68);color:#3a2865;font-weight:900;font-size:17px;box-shadow:0 7px 0 #bb8649,0 12px 35px #f4be7860;transition:transform .13s,filter .2s}.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #bb8649}.btn:disabled{filter:grayscale(.4);opacity:.5;cursor:default}.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:27px 0}.keycard{background:#ffffff10;border:1px solid #ffffff33;border-radius:22px;padding:18px;text-align:center;backdrop-filter:blur(8px)}.keycard .symbol{font-size:38px;display:block}.keycard b{font-size:16px}.keycard small{display:block;color:#e2dafa}.panel{background:linear-gradient(145deg,#fffdf7,#fff3e7);color:var(--ink);padding:clamp(20px,4.5vw,40px);border:3px solid #e7c790;border-radius:30px;box-shadow:0 24px 0 #100c3170,0 40px 70px #0006;position:relative;overflow:hidden;animation:appear .46s both}@keyframes appear{from{transform:translateY(17px);opacity:0}to{transform:none;opacity:1}}.panel:before{content:'✧ ✦ ✧';position:absolute;right:25px;top:10px;color:#dca2d3;font-size:25px;letter-spacing:8px;opacity:.6}.panel h2{color:#5d368e}.panel .eyebrow{color:#a16aab}.rule{background:#f4edff;border:1px solid #dac6ff;border-radius:18px;padding:17px 19px;margin:20px 0}.rule strong{color:#6939a0}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.ruleitem{background:#fff;border:1px solid #e4d7fa;border-radius:16px;text-align:center;padding:16px 7px;font-size:19px}.ruleitem strong{color:#844ac2;font-size:24px}.pic{font-size:clamp(75px,12vw,140px);margin:8px 0 14px;text-align:center;filter:drop-shadow(0 9px 6px #5b4b8025)}.word{font-weight:950;font-size:clamp(40px,7vw,64px);color:#6941af;letter-spacing:.01em}.smallnote{font-size:14px;color:#765f8b}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.option{padding:16px 12px;background:white;border:2px solid #ddd0f7;border-radius:20px;color:#4b337e;font-size:clamp(17px,3vw,24px);font-weight:850;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;min-height:70px}.option:hover{transform:translateY(-3px);border-color:#a579ec}.option.correct{background:#dcfff0;border-color:#3bbd8c}.option.wrong{background:#ffe2eb;border-color:#e982a4}.option:disabled{cursor:default}.instruction{font-size:20px;font-weight:800;margin:14px 0 0}.translation{color:#87779a;font-size:15px}.feedback{border-radius:16px;padding:12px 16px;margin:12px 0 15px;font-weight:750;background:#f2e8ff}.feedback.good{background:#d9f8ea;color:#176747}.feedback.bad{background:#ffe1e5;color:#943a52}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}.spoken{border:1px solid #dbc1ff;background:#eee6ff;border-radius:999px;padding:9px 17px;cursor:pointer;font-weight:750;color:#683ca7}.qnum{color:#cdbfe8;font-size:14px;font-weight:800}.choices-pictures .option{font-size:44px}.pronrow{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px}.bigemoji{font-size:74px}.fillword{font-size:clamp(35px,7vw,65px);font-weight:900;color:#6840b4;text-align:center;margin:16px 0}.blank{color:#d293d1;border-bottom:4px dashed #d293d1}.footer{text-align:center;color:#d3c7eb;font-size:13px;margin-top:35px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti i{position:absolute;top:-8%;font-size:23px;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(120vh) rotate(460deg);opacity:0}}.result{text-align:center}.result .big{font-size:80px}.result h2{margin:10px}.hidden{display:none!important}@media(max-width:700px){.hero{grid-template-columns:1fr}.heroart{max-width:275px;grid-row:1}.journey{grid-template-columns:1fr 1fr 1fr;gap:6px}.keycard{padding:10px 5px;font-size:12px}.keycard .symbol{font-size:27px}.keycard b{font-size:12px}.keycard small{font-size:11px}.rules{grid-template-columns:1fr}.options{gap:7px}.option{padding:13px 6px;min-height:60px}.shell{padding:13px 13px 50px}.top{margin-bottom:12px}.panel{border-radius:22px}.lead{font-size:17px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><div class="stars"></div><div class="confetti" id="confetti"></div><main class="shell"><div class="top"><div class="brand"><span class="orb">✦</span><span>MAGIC ENGLISH<br><small style="color:#c9c0e8;font-size:12px">Katya's Academy</small></span></div><button class="softbtn" id="reset" type="button">↻ Сначала</button></div><div class="progress" aria-label="Прогресс"><div id="bar"></div></div><div id="app"></div><div class="footer">✨ Учи маленькими шагами — и у тебя всё получится ✨</div></main><script>

const chapters=[{name:'Ключ 1',title:'To be',icon:'🪄',desc:'I am · she is · they are'},{name:'Ключ 2',title:'Долгий OO',icon:'🌙',desc:'moon · spoon · zoo'},{name:'Ключ 3',title:'AW и AU',icon:'🦉',desc:'saw · paw · autumn'}];
const questions=[
{c:0,k:'choice',ask:'Выбери правильное слово',line:'I ___ Katya.',ru:'Я — Катя.',pic:'👧',opts:['is','am','are'],ans:1,read:'I am Katya.',hint:'С I всегда используем am.'},
{c:0,k:'choice',ask:'Выбери правильное слово',line:'She ___ happy.',ru:'Она счастлива.',pic:'👧💗',opts:['are','is','am'],ans:1,read:'She is happy.',hint:'С she используем is.'},
{c:0,k:'choice',ask:'Выбери правильное слово',line:'He ___ a boy.',ru:'Он мальчик.',pic:'👦',opts:['am','are','is'],ans:2,read:'He is a boy.',hint:'С he используем is.'},
{c:0,k:'choice',ask:'Выбери правильное слово',line:'It ___ a cat.',ru:'Это кот.',pic:'🐈',opts:['is','am','are'],ans:0,read:'It is a cat.',hint:'С it используем is.'},
{c:0,k:'choice',ask:'Выбери правильное слово',line:'We ___ friends.',ru:'Мы друзья.',pic:'👧🤝👦',opts:['is','are','am'],ans:1,read:'We are friends.',hint:'С we используем are.'},
{c:0,k:'choice',ask:'Выбери правильное слово',line:'They ___ happy.',ru:'Они счастливы.',pic:'👧👦👧',opts:['am','is','are'],ans:2,read:'They are happy.',hint:'С they используем are.'},
{c:1,k:'picture',ask:'Прочитай слово и выбери картинку',line:'moon',ru:'луна',opts:['🌙','🥄','🥾'],ans:0,read:'moon',hint:'moon — луна. Две буквы oo дают долгий звук /uː/.'},
{c:1,k:'picture',ask:'Прочитай слово и выбери картинку',line:'spoon',ru:'ложка',opts:['🥾','🥄','🌙'],ans:1,read:'spoon',hint:'spoon — ложка.'},
{c:1,k:'picture',ask:'Прочитай слово и выбери картинку',line:'boot',ru:'сапог',opts:['🥄','🌙','🥾'],ans:2,read:'boot',hint:'boot — сапог.'},
{c:1,k:'letters',ask:'Вставь пропущенное сочетание',line:'m__n',ru:'moon — луна 🌙',opts:['oo','aw','au'],ans:0,read:'moon',hint:'Посмотри на слово-подсказку moon. Какие две буквы стоят в середине?'},
{c:1,k:'letters',ask:'Вставь пропущенное сочетание',line:'sp__n',ru:'spoon — ложка 🥄',opts:['aw','oo','au'],ans:1,read:'spoon',hint:'Подсказка: spoon.'},
{c:1,k:'letters',ask:'Вставь пропущенное сочетание',line:'f__d',ru:'food — еда 🍽️',opts:['au','aw','oo'],ans:2,read:'food',hint:'Подсказка: food.'},
{c:2,k:'sort',ask:'Найди сочетание в слове',line:'saw',ru:'пила 🪚',opts:['au','aw'],ans:1,read:'saw',hint:'В слове saw в конце пишется aw.'},
{c:2,k:'sort',ask:'Найди сочетание в слове',line:'paw',ru:'лапа 🐾',opts:['aw','au'],ans:0,read:'paw',hint:'В слове paw — aw.'},
{c:2,k:'sort',ask:'Найди сочетание в слове',line:'draw',ru:'рисовать ✏️',opts:['au','aw'],ans:1,read:'draw',hint:'В слове draw — aw.'},
{c:2,k:'sort',ask:'Найди сочетание в слове',line:'autumn',ru:'осень 🍂',opts:['aw','au'],ans:1,read:'autumn',hint:'В слове autumn — au.'},
{c:2,k:'sort',ask:'Найди сочетание в слове',line:'August',ru:'август ☀️',opts:['au','aw'],ans:0,read:'August',hint:'В слове August — au.'},
{c:2,k:'sort',ask:'Найди сочетание в слове',line:'sauce',ru:'соус 🥫',opts:['aw','au'],ans:1,read:'sauce',hint:'В слове sauce — au.'},
{c:3,k:'choice',ask:'Последняя проверка!',line:'You ___ my friend.',ru:'Ты мой друг.',pic:'🤝',opts:['am','is','are'],ans:2,read:'You are my friend.',hint:'С you — are.'},
{c:3,k:'picture',ask:'Последняя проверка!',line:'zoo',ru:'зоопарк',opts:['🥄','🦁','🥾'],ans:1,read:'zoo',hint:'zoo — зоопарк.'},
{c:3,k:'sort',ask:'Последняя проверка!',line:'paw',ru:'лапа 🐾',opts:['aw','au'],ans:0,read:'paw',hint:'paw содержит aw.'}
];
let step=-1,answered=false,wrong=0,stars=0;const app=document.getElementById('app'),bar=document.getElementById('bar');const KEY='katya_magic_homework_v2';try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isInteger(s.step)&&s.step>=-1&&s.step<=questions.length){step=s.step;stars=s.stars||0;wrong=s.wrong||0}}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify({step,stars,wrong}))}catch(e){}}function speak(word){if(!('speechSynthesis'in window))return;const s=new SpeechSynthesisUtterance(word);s.lang='en-US';s.rate=.74;window.speechSynthesis.cancel();window.speechSynthesis.speak(s)}function sparkle(){const el=document.getElementById('confetti');el.innerHTML='';for(let i=0;i<28;i++){let x=document.createElement('i');x.textContent=['✦','✧','⭐','💗'][i%4];x.style.left=(Math.random()*100)+'%';x.style.animationDelay=(Math.random()*.35)+'s';el.appendChild(x)}setTimeout(()=>el.innerHTML='',1950)}function nav(next){step=next;answered=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}function titleHtml(c){let x=chapters[c];return `<div class="eyebrow">${x.name} · ${x.icon}</div><h2>${x.title}</h2>`}function intro(c){if(c===3)return `<div class="pic">🗝️✨🏰</div><div class="rule">Ты собрала три ключа! Теперь вспомни <strong>to be</strong>, долгое <strong>oo</strong> и сочетания <strong>aw / au</strong> в трёх последних вопросах.</div>`;if(c===0)return `<div class="rule"><b>Глагол to be</b> — маленькое слово-помощник. По-русски мы часто его не произносим: «Я Катя», а по-английски говорим <b>I am Katya.</b></div><div class="rules"><div class="ruleitem">👧<br>I <strong>am</strong></div><div class="ruleitem">👦🐈<br>he · she · it <strong>is</strong></div><div class="ruleitem">👧👦<br>you · we · they <strong>are</strong></div></div><p class="smallnote" style="margin-top:18px">Послушай пример, затем выбирай am, is или are по местоимению.</p><button class="spoken" onclick="speak('I am Katya. She is happy. We are friends.')">🔊 Послушать примеры</button>`;if(c===1)return `<div class="pic">🌙 🥄 🥾</div><div class="rule">Две буквы <strong>oo</strong> часто читаются как один долгий звук <strong>/uː/</strong>: <b>moon</b> (луна), <b>spoon</b> (ложка), <b>food</b> (еда), <b>boot</b> (сапог), <b>zoo</b> (зоопарк).</div><p>Это похоже на долгое «у-у-у». Сначала слушай и читай, потом находи нужную картинку или буквы.</p><button class="spoken" onclick="speak('moon. spoon. food. boot. zoo.')">🔊 Послушать пять слов</button><p class="smallnote" style="margin-top:15px">Не во всех словах oo звучит долго: например, book и look читаются иначе. Сегодня тренируем долгий звук.</p>`;return `<div class="pic">🐾 🪚 🍂</div><div class="rule">Сочетания <strong>aw</strong> и <strong>au</strong> часто передают похожий звук <strong>/ɔː/</strong>. Посмотри на слово, произнеси его, а затем найди сочетание букв.</div><div class="rules"><div class="ruleitem"><strong>AW</strong><br>saw<br>paw<br>draw</div><div class="ruleitem"><strong>AU</strong><br>autumn<br>August<br>sauce</div><div class="ruleitem">🔍<br>Смотри на буквы,<br>не угадывай!</div></div><p class="smallnote" style="margin-top:16px">AW часто бывает в конце, AU часто внутри слова, но это не строгое правило. В английском произношение может немного различаться по акценту.</p><button class="spoken" onclick="speak('saw. paw. draw. autumn. August. sauce.')">🔊 Послушать слова</button>`}
function render(){bar.style.width=(Math.max(0,step)/questions.length*100)+'%';if(step===-1){app.innerHTML=`<section class="hero"><div>${titleHtml(0).replace('Ключ 1 · 🪄','Волшебная домашка · 2 класс').replace('To be','Катя и три волшебных ключа')}<p class="lead">Три ключа спрятались в Волшебной академии. Найди их с помощью английского: <b>to be</b>, долгого <b>oo</b> и сочетаний <b>aw / au</b>.</p><p>⏳ 15–20 минут · 🔊 С озвучкой · 🌟 С наградами</p><button class="btn" onclick="nav(0)">Начать приключение ✨</button></div>${svg}</section><div class="journey">${chapters.map(x=>`<div class="keycard"><span class="symbol">${x.icon}</span><b>${x.title}</b><small>${x.desc}</small></div>`).join('')}</div>`;return}if(step>=questions.length){bar.style.width='100%';app.innerHTML=`<section class="panel result"><div class="big">🏆✨</div><div class="eyebrow">Все три ключа найдены!</div><h2>Катя, ты молодец!</h2><p>Ты прошла <b>${questions.length}</b> заданий и заработала <b>${stars} ⭐</b>.</p><p class="smallnote">Ошибки — часть обучения. Если какой-то звук был трудным, потренируй его ещё раз.</p><div class="actions" style="justify-content:center"><button class="softbtn" style="color:var(--ink);border-color:#b4a3c9" onclick="copyResult()">📋 Скопировать результат</button><button class="btn" onclick="restart()">Пройти ещё раз</button></div><p id="copied" class="smallnote"></p></section>`;return}const q=questions[step];const previous=step?questions[step-1]:null;const newChapter=!previous||q.c!==previous.c;if(newChapter&&!window.__shownIntro?.[step]){window.__shownIntro=window.__shownIntro||{};app.innerHTML=`<section class="panel">${titleHtml(q.c)}${intro(q.c)}<div class="actions"><button class="softbtn" style="color:var(--ink);border-color:#c7b7df" onclick="nav(${step===0?-1:step-1})">← Назад</button><button class="btn" onclick="window.__shownIntro[${step}]=true;render()">Понятно, вперёд ✨</button></div></section>`;return}let body=q.k==='choice'?`<div class="pic">${q.pic}</div><div class="fillword">${q.line.replace('___','<span class="blank">___</span>')}</div>`:q.k==='letters'?`<div class="fillword">${q.line.replace('__','<span class="blank">__</span>')}</div><div class="pic">${q.ru.split(' ').slice(-1)}</div>`:`<div class="pic">${q.k==='sort'?'🔎':'📖'}</div><div class="word" style="text-align:center">${q.line}</div>`;app.innerHTML=`<section class="panel"><div class="eyebrow">${q.c===3?'Финальный портал':chapters[q.c].name+' · '+chapters[q.c].title}</div><div class="qnum">Задание ${step+1} из ${questions.length}</div><div class="instruction">${q.ask}</div>${body}<p class="translation" style="text-align:center">${q.ru}</p><div class="options ${q.k==='picture'?'choices-pictures':''}" id="opts" style="grid-template-columns:repeat(${q.opts.length},1fr)">${q.opts.map((x,i)=>`<button class="option" data-choice="${i}" onclick="choose(${i})">${x}</button>`).join('')}</div><div id="feedback" role="status"></div><div class="actions"><button class="softbtn" style="color:var(--ink);border-color:#c7b7df" onclick="nav(${step===0?-1:step-1})">← Назад</button><button class="spoken" onclick="speak('${q.read.replace(/'/g,'')}')">🔊 Послушать слово</button><button class="btn" disabled id="next" onclick="nav(${step+1})">Дальше →</button></div></section>`;}
function choose(i){let q=questions[step];if(answered)return;let btns=[...document.querySelectorAll('.option')];if(i===q.ans){answered=true;stars++;save();btns.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('correct')});document.getElementById('feedback').innerHTML=`<div class="feedback good">🌟 Правильно! ${q.read} <button class="spoken" onclick="speak('${q.read.replace(/'/g,'')}')">🔊</button></div>`;document.getElementById('next').disabled=false;sparkle()}else{wrong++;save();btns[i].classList.add('wrong');document.getElementById('feedback').innerHTML=`<div class="feedback bad">Попробуй ещё раз! 💗 ${q.hint}</div>`;setTimeout(()=>{if(!answered&&btns[i])btns[i].classList.remove('wrong')},850)}}function restart(){step=-1;stars=0;wrong=0;window.__shownIntro={};save();render()}function copyResult(){let s=`Катя — волшебная домашка\nТемы: to be, долгий oo, aw/au\nПройдено: ${questions.length}/${questions.length}\nВерных решений: ${stars}\nПопыток с ошибками: ${wrong}`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>{document.getElementById('copied').textContent='Результат скопирован!'}).catch(()=>{document.getElementById('copied').textContent=s})}else document.getElementById('copied').textContent=s}document.getElementById('reset').onclick=()=>{if(confirm('Начать приключение заново?'))restart()};render();
</script></body></html>
