let step=-1,answered=false,wrong=0,stars=0;const app=document.getElementById('app'),bar=document.getElementById('bar');const KEY='katya_magic_homework_v5';try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isInteger(s.step)&&s.step>=-1&&s.step<=questions.length){step=s.step;stars=s.stars||0;wrong=s.wrong||0}}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify({step,stars,wrong}))}catch(e){}}function speak(word){if(!('speechSynthesis'in window))return;const s=new SpeechSynthesisUtterance(word);s.lang='en-US';s.rate=.74;window.speechSynthesis.cancel();window.speechSynthesis.speak(s)}function sparkle(){const el=document.getElementById('confetti');el.innerHTML='';for(let i=0;i<28;i++){let x=document.createElement('i');x.textContent=['✦','✧','⭐','💗'][i%4];x.style.left=(Math.random()*100)+'%';x.style.animationDelay=(Math.random()*.35)+'s';el.appendChild(x)}setTimeout(()=>el.innerHTML='',1950)}function nav(next){step=next;answered=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}function titleHtml(c){let x=chapters[c]||{name:'Финал',title:'Последний портал',icon:'🏰'};return `<div class="eyebrow">${x.name} · ${x.icon}</div><h2>${x.title}</h2>`}function intro(c){
if(c===4)return `<div class="pic">🏰✨🗝️</div><div class="rule">Ты прошла все главы! Отличная работа! Впереди большая проверка <strong>to be</strong>, <strong>PH</strong>, <strong>OR</strong> и кратких ответов <strong>Yes / No</strong>.</div>`;
if(c===0)return `<div class="pic">👧 🪄 👦</div><div class="rule"><b>To be</b> помогает рассказать, кто мы и какие мы. По-русски: «Я Катя». По-английски: <b>I am Katya.</b></div><div class="rules"><div class="ruleitem">👧<br>I <strong>am</strong></div><div class="ruleitem">👦🐈<br>he · she · it <strong>is</strong></div><div class="ruleitem">👧👦<br>you · we · they <strong>are</strong></div></div><p class="smallnote" style="margin-top:15px">Читай простое предложение и выбирай правильное слово. Перевод рядом!</p><button class="spoken" onclick="speak('I am Katya. She is happy. We are friends.')">🔊 Послушать</button>`;
if(c===1)return `<div class="pic">📸 🐬 ☎️</div><div class="rule"><strong>PH</strong> — две буквы, но один звук <strong>/f/</strong>, как английская F. Слушай и читай: <b>phone</b> (телефон), <b>photo</b> (фото), <b>dolphin</b> (дельфин), <b>elephant</b> (слон).</div><button class="spoken" onclick="speak('phone. photo. dolphin. elephant.')">🔊 Послушать слова</button><p class="smallnote">Можно смотреть на русские подсказки и рисунки: мы тренируем именно чтение.</p>`;
if(c===2)return `<div class="pic">🐴 🌽 🍴</div><div class="rule"><strong>OR</strong> в словах <b>horse</b> (лошадь), <b>fork</b> (вилка), <b>corn</b> (кукуруза), <b>short</b> (короткий) и <b>storm</b> (буря) звучит как /ɔr/ в американском английском (или /ɔː/ в британском). Это не универсальное правило для всех слов с OR.</div><button class="spoken" onclick="speak('horse. fork. corn. short. storm.')">🔊 Послушать слова</button><p class="smallnote">Прочитай слово вслух, а потом найди картинку или сочетание букв.</p>`;
return `<div class="pic">💬 ✨ 💬</div><div class="rule"><b>Краткие ответы с to be.</b> В вопросе <strong>Am / Is / Are</strong> ставим перед местоимением, а в коротком ответе меняем порядок обратно.</div><div class="rules"><div class="ruleitem">Are you...?<br><strong>Yes, I am.</strong><br>No, I'm not.</div><div class="ruleitem">Is he / she / it...?<br><strong>Yes, she is.</strong><br>No, he isn't.</div><div class="ruleitem">Are we / they...?<br><strong>Yes, we are.</strong><br>No, they aren't.</div></div><p class="smallnote" style="margin-top:15px">Прочитай вопрос, посмотри на русскую подсказку «да» или «нет» и выбери краткий ответ.</p><button class="spoken" onclick="speak('Are you Katya? Yes, I am. Is she happy? Yes, she is. Are they dogs? No, they are not.')">🔊 Послушать примеры</button>`;
}
function render(){bar.style.width=(Math.max(0,step)/questions.length*100)+'%';if(step===-1){app.innerHTML=`<section class="hero"><div>${titleHtml(0).replace('Ключ 1 · 🪄','Волшебная домашка · 2 класс').replace('To be','Катя и четыре волшебных ключа')}<p class="lead">Катя, тебя ждёт большая тренировка! Закрепи <b>to be</b>, научись замечать <b>ph</b> и <b>or</b> в новых словах и отвечай на вопросы коротко и правильно. В каждой главе разные испытания — выбирай, читай, слушай и исправляй ошибки.</p><p>⏳ 35–45 минут: можно проходить по частям · 🔊 С озвучкой · 🌟 С наградами</p><button class="btn" onclick="nav(0)">Начать приключение ✨</button></div>${svg}</section><div class="journey">${chapters.map(x=>`<div class="keycard"><span class="symbol">${x.icon}</span><b>${x.title}</b><small>${x.desc}</small></div>`).join('')}</div>`;return}if(step>=questions.length){bar.style.width='100%';app.innerHTML=`<section class="panel result"><div class="big">🏆✨</div><div class="eyebrow">Все четыре ключа найдены!</div><h2>Катя, ты молодец!</h2><p>Ты прошла <b>${questions.length}</b> заданий и заработала <b>${stars} ⭐</b>.</p><p class="smallnote">Ошибки — часть обучения. Если какой-то звук был трудным, потренируй его ещё раз.</p><div class="actions" style="justify-content:center"><button class="softbtn" style="color:var(--ink);border-color:#b4a3c9" onclick="copyResult()">📋 Скопировать результат</button><button class="btn" onclick="restart()">Пройти ещё раз</button></div><p id="copied" class="smallnote"></p></section>`;return}const q=questions[step];const previous=step?questions[step-1]:null;const newChapter=!previous||q.c!==previous.c;if(newChapter&&!window.__shownIntro?.[step]){window.__shownIntro=window.__shownIntro||{};app.innerHTML=`<section class="panel">${titleHtml(q.c)}${intro(q.c)}<div class="actions"><button class="softbtn" style="color:var(--ink);border-color:#c7b7df" onclick="nav(${step===0?-1:step-1})">← Назад</button><button class="btn" onclick="window.__shownIntro[${step}]=true;render()">Понятно, вперёд ✨</button></div></section>`;return}let body=q.k==='choice'?'<div class="pic">'+q.pic+'</div><div class="fillword">'+q.line.replace('___','<span class="blank">___</span>')+'</div>':q.k==='letters'?'<div class="pic">'+q.pic+'</div><div class="fillword">'+q.line.replace('__','<span class="blank">__</span>')+'</div>':q.k==='picture'?'<div class="word" style="text-align:center">'+q.line+'</div><div class="smallnote" style="text-align:center">🔎 Прочитай и выбери одну из картинок ниже</div>':'<div class="pic">'+q.pic+'</div><div class="word" style="text-align:center;font-size:clamp(27px,6vw,46px)">'+q.line+'</div>';app.innerHTML=`<section class="panel"><div class="eyebrow">${q.c===4?'Финальный портал':chapters[q.c].name+' · '+chapters[q.c].title}</div><div class="qnum">Задание ${step+1} из ${questions.length}</div><div class="instruction">${q.ask}</div>${body}<p class="translation" style="text-align:center">${q.ru}</p><div class="options ${q.k==='picture'?'choices-pictures':''}" id="opts" style="grid-template-columns:repeat(${q.opts.length},1fr)">${q.opts.map((x,i)=>`<button class="option" data-choice="${i}" onclick="choose(${i})">${x}</button>`).join('')}</div><div id="feedback" role="status"></div><div class="actions"><button class="softbtn" style="color:var(--ink);border-color:#c7b7df" onclick="nav(${step===0?-1:step-1})">← Назад</button><button class="spoken" onclick="speak('${q.read.replace(/'/g,'')}')">🔊 Послушать</button><button class="btn" disabled id="next" onclick="nav(${step+1})">Дальше →</button></div></section>`;}
function choose(i){let q=questions[step];if(answered)return;let btns=[...document.querySelectorAll('.option')];if(i===q.ans){answered=true;stars++;save();btns.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('correct')});document.getElementById('feedback').innerHTML=`<div class="feedback good">🌟 Правильно! ${q.read} <button class="spoken" onclick="speak('${q.read.replace(/'/g,'')}')">🔊</button></div>`;document.getElementById('next').disabled=false;sparkle()}else{wrong++;save();btns[i].classList.add('wrong');document.getElementById('feedback').innerHTML=`<div class="feedback bad">Попробуй ещё раз! 💗 ${q.hint}</div>`;setTimeout(()=>{if(!answered&&btns[i])btns[i].classList.remove('wrong')},850)}}function restart(){step=-1;stars=0;wrong=0;window.__shownIntro={};save();render()}function copyResult(){let s=`Катя — волшебная домашка\nТемы: to be, ph, or, краткие ответы Yes/No\nПройдено: ${questions.length}/${questions.length}\nВерных решений: ${stars}\nПопыток с ошибками: ${wrong}`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>{document.getElementById('copied').textContent='Результат скопирован!'}).catch(()=>{document.getElementById('copied').textContent=s})}else document.getElementById('copied').textContent=s}document.getElementById('reset').onclick=()=>{if(confirm('Начать приключение заново?'))restart()};render();
</script></body></html>
