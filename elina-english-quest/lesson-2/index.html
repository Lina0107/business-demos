order:1px solid #e9e4fa;border-radius:22px;margin:24px 0 14px}.question{background:white;border:1px solid #e7def9;border-radius:18px;padding:17px;margin:12px 0}.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.qtop small{color:#8269c8;font-weight:900}.prompt{font:600 23px/1.3 Fredoka;margin:12px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.option{border:2px solid #ebe4fa;border-radius:14px;background:#fff;font-size:17px;font-weight:900;color:#3b315d;min-height:57px;padding:10px}.option.correct{background:#e9fcf5;border-color:#4ccbab}.option.wrong{background:#fff0f5;border-color:#efa0bf}.feedback{min-height:23px;margin-top:9px;font-size:13px;font-weight:900}.feedback.ok{color:#188f74}.feedback.no{color:#cc5382}.btn{background:var(--purple);border:0;color:white;border-radius:14px;padding:13px 19px;font-weight:900}.outline{border:1.5px solid #d8cafa;background:white;border-radius:13px;color:#6a4eb9;padding:10px 13px;font-weight:900}.answer{background:#fff;padding:12px;border-radius:13px;border:1px dashed #d5c4ee;font-size:13px;margin:9px 0}.controls{display:flex;justify-content:space-between;gap:9px;margin-top:23px}.end{background:linear-gradient(110deg,#fbe8f2,#ecf8ff);border-radius:23px;padding:25px;text-align:center}.end h3{font:600 31px Fredoka;margin:8px}.sentence{font:600 clamp(20px,3vw,29px)/1.7 Fredoka;background:#fff6fc;border-radius:18px;padding:12px 18px;margin:10px 0}.sentence button{vertical-align:middle}.hidden{display:none!important}footer{text-align:center;margin-top:24px;color:#a294b3;font-size:12px}@media(max-width:820px){.columns{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.hero .art{font-size:55px}}@media(max-width:520px){.wrap{padding:11px 10px 45px}.hero{padding:23px}.hero .art{display:none}.panel{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.numbergrid{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.prompt{font-size:21px}.tab{min-height: {icon:'🎒',title:'School Bag Detective',min:'10 мин',intro:'Вспомним названия школьных вещей и научимся быстро их узнавать.',teacher:`<ol><li>Попросите Элину назвать предмет по картинке до нажатия на карточку.</li><li>Прослушайте слово и повторите вслух. Различайте <b>book</b> (книга), <b>notebook</b> (тетрадь), <b>textbook</b> (учебник).</li><li><b>School bag</b> — рюкзак/школьная сумка; <b>pencil case</b> — пенал. Попросите показать реальные предметы.</li><li>После карточек задайте вопросы: «Как будет линейка? А пенал?»</li></ol>`,content:()=>`<div class="callout lilac"><b>Шаг 1:</b> сначала попробуй назвать вещь сама. Нажми на карточку, чтобы услышать английское слово. Учитель может помочь перевести незнакомое.</div><div class="cards">${school.map(([e,w,ru])=>`<button class="card" data-say="${w}"><span class="emoji">${e}</span><b>${w}</b><small>🔊 Нажми и повтори</small></button>`).join('')}</div><div class="callout mint"><b>Скажи вслух:</b> «Это ручка», «Это линейка», «Это мой рюкзак». Пока главное — уверенно назвать предмет, не вводим новую грамматику.</div>`},
{icon:'🧩',title:'Pack My School Bag',min:'10 мин',intro:'Закрепляем написание и смысл уже знакомых слов.',teacher:`<ol><li>Попросите ученицу произнести слово по-английски, прежде чем выбирать ответ.</li><li>Обратите внимание на пары <b>pen / pencil</b> и <b>book / notebook</b>.</li><li>Не требуйте знания новых правил чтения: слова можно узнавать целиком. Чтение по звукам будете отрабатывать отдельно.</li><li>В устной игре «Собери портфель» называйте по одному предмету: <b>pen, ruler, notebook</b>, Элина показывает предмет.</li></ol>`,content:()=>`<div class="callout"><b>Игра:</b> представь, что собираешь рюкзак. Назови на английском 5 вещей, которые возьмёшь в школу. Потом проверь себя в заданиях.</div><div class="sentence">🎒 My school bag: <button class="outline" data-say="pen, pencil, book, notebook, ruler">🔊 Слушать слова</button></div><div class="callout mint"><b>Устная мини-игра:</b> учитель говорит слово по-русски, Элина называет его по-английски. Затем поменяйтесь ролями.</div>`},
{icon:'🔟',title:'Number Magic',min:'12 мин',intro:'Освежаем числа до 100: особенно похожие 13/30 и 14/40.',teacher:`<ol><li>Начните с счёта от 1 до 20, затем десятками: 20, 30, 40 … 100.</li><li>Разъясните <b>-teen</b> в 13–19 и <b>-ty</b> у десятков (twenty, thirty, forty). Сравните на слух <b>thirteen / thirty</b>, <b>fourteen / forty</b>.</li><li>Обратите внимание на написания: <b>thirteen</b>, <b>fifteen</b>, <b>eighteen</b>, <b>thirty</b>, <b>forty</b> (не fourty), <b>fifty</b>.</li><li>Для чисел 21–99: <b>twenty-one, thirty-five</b> — десятки + единицы.</li></ol>`,content:()=>`<div class="callout lilac"><b>Как строятся числа:</b><br>13–19 часто оканчиваются на <b>-teen</b>: thir<b>teen</b>, four<b>teen</b>, fif<b>teen</b>.<br>20, 30, 40… — десятки на <b>-ty</b>: twen<b>ty</b>, thir<b>ty</b>, for<b>ty</b>.<br><b>40 = forty</b>, не <s>fourty</s>.<br>После десятков прибавляем единицы: <b>twenty-four = 24</b>, <b>sixty-seven = 67</b>.</div><div class="numbergrid">${[[13,'thirteen'],[30,'thirty'],[14,'fourteen'],[40,'forty'],[15,'fifteen'],[50,'fifty'],[18,'eighteen'],[80,'eighty'],[27,'twenty-seven'],[63,'sixty-three'],[99,'ninety-nine'],[100,'one hundred']].map(([n,w])=>`<button class="number" data-say="${w}">${n}<small>🔊 Послушать</small></button>`).join('')}</div><div class="callout mint"><b>Устно:</b> 13 → 30 → 14 → 40 → 15 → 50. Сначала прочитай сама, потом проверь произношение.</div>`},
{icon:'🚀',title:'Hundreds & Thousands',min:'12 мин',intro:'Собираем большие числа по частям: сотни и тысячи.',teacher:`<ol><li>Объясните опорные единицы: <b>100 = one hundred</b>, <b>1000 = one thousand</b>.</li><li><b>200 = two hundred</b>, <b>3000 = three thousand</b> — после конкретного числа <b>hundred/thousand</b> без -s.</li><li>Сборка: <b>245 = two hundred and forty-five</b> (распространённый британский вариант); в американском часто без and: <b>two hundred forty-five</b>.</li><li><b>1200</b> можно назвать <b>one thousand two hundred</b>; <b>2300 = two thousand three hundred</b>.</li><li>Для 101: <b>one hundred and one</b> (BrE), для 1010: <b>one thousand and ten</b> (BrE). Не делайте различие вариантов отдельным тестом.</li></ol>`,content:()=>`<div class="callout lilac"><b>Секрет больших чисел:</b><br><b>100</b> — one hundred · <b>1,000</b> — one thousand.<br><b>300</b> = three hundred (не <s>three hundreds</s>).<br><b>2,000</b> = two thousand (не <s>two thousands</s>).<br><b>245</b> = two hundred and forty-five.<br><b>2,345</b> = two thousand three hundred and forty-five.<br><small>Здесь используем британский вариант с <b>and</b>; американский вариант часто опускает and после hundred.</small></div><div class="numbergrid">${[[100,'one hundred'],[200,'two hundred'],[105,'one hundred and five'],[240,'two hundred and forty'],[500,'five hundred'],[999,'nine hundred and ninety-nine'],[1000,'one thousand'],[1200,'one thousand two hundred'],[2300,'two thousand three hundred'],[3456,'three thousand four hundred and fifty-six'],[10000,'ten thousand'],[12050,'twelve thousand and fifty']].map(([n,w])=>`<button class="number" data-say="${w}">${n.toLocaleString('en-US')}<small>🔊 Произнести</small></button>`).join('')}</div><div class="callout mint"><b>Собери по ступенькам:</b> 4 → 40 → 400 → 1400 → 2400. Сначала устно, потом с озвучкой.</div>`},
{icon:'🏫',title:'School Shop',min:'9 мин',intro:'Играем в школьный магазин: предметы и числа вместе.',teacher:`<ol><li>Это применение знакомых слов и чисел, а не новая грамматическая тема.</li><li>Отработайте фразы как готовые модели: <b>How many?</b> — «Сколько?»; <b>Three pencils.</b> — «Три карандаша».</li><li>Обратите внимание: после 2 и более предметов обычно добавляем -s: <b>two pens, five books, ten rulers</b>. Для <b>pencil case</b>: two pencil cases.</li><li>В игре учитель — продавец, Элина — покупатель. Поменяйтесь ролями. Если числа большие, их можно использовать как условные баллы или номера, а не как реальное число предметов.</li></ol>`,content:()=>`<div class="callout lilac"><b>Маленькая подсказка:</b> <b>one pen</b> — одна ручка, но <b>two pens</b> — две ручки. После 2, 3, 4 и других чисел обычно добавляем <b>-s</b> к предмету: three books, ten rulers.<br><b>How many?</b> — Сколько?</div><div class="sentence">✏️ Three pencils. <button class="outline" data-say="Three pencils">🔊</button></div><div class="sentence">📚 Five books. <button class="outline" data-say="Five books">🔊</button></div><div class="sentence">📏 Ten rulers. <button class="outline" data-say="Ten rulers">🔊</button></div><div class="callout mint"><b>Ролевая игра:</b> учитель говорит <b>How many pens?</b>, Элина отвечает <b>Four pens!</b>. Затем используйте notebook, book, ruler, pencil.</div>`},
{icon:'🏆',title:'Final Star Challenge',min:'7 мин',intro:'Финальная проверка: что Элина помнит без подсказок?',teacher:`<ol><li>Попросите назвать без карточек <b>6 школьных предметов</b> по-английски.</li><li>Продиктуйте числа <b>13, 30, 48, 115, 2000, 2345</b>. Пусть назовёт их вслух и найдёт верное написание.</li><li>Запишите, что пока путает: лексика, teen/ty, десятки, hundreds/thousands.</li><li>После выполнения предложите исправить ошибки устно; не выдавайте следующую тему, пока текущие числа не закреплены.</li></ol>`,content:()=>`<div class="end"><div style="font-size:62px">🌟🎒🏆</div><h3>Great job, Elina!</h3><p>Пройди последний уровень без подсказок и получи свои звёзды.</p><strong>Школьные вещи + числа от единиц до тысяч</strong></div>`}
];
const q=[
[{q:'📏 Что это?',o:['ruler','eraser','book','pen'],a:0,s:'ruler',h:'Линейка — ruler.'},{q:'📓 Как сказать «тетрадь»?',o:['textbook','notebook','pencil','desk'],a:1,s:'notebook',h:'Notebook — тетрадь; textbook — учебник.'},{q:'✏️ Как будет «карандаш»?',o:['pen','pencil','ruler','book'],a:1,s:'pencil',h:'Pen — ручка, pencil — карандаш.'}],
[{q:'Где слово «пенал»?',o:['pencil case','school bag','notebook','eraser'],a:0,s:'pencil case',h:'Pencil case — пенал.'},{q:'📖 Как будет «учебник»?',o:['notebook','textbook','ruler','desk'],a:1,s:'textbook',h:'Textbook — учебник.'},{q:'🧽 Что значит eraser?',o:['ластик','линейка','карандаш','ручка'],a:0,s:'eraser',h:'Eraser — ластик.'}],
[{q:'13 = ?',o:['thirty','thirteen','three','thirty-three'],a:1,s:'thirteen',h:'13 — thirteen; 30 — thirty.'},{q:'Как правильно пишется 40?',o:['fourty','fourteen','forty','four'],a:2,s:'forty',h:'Правильно forty — без u.'},{q:'57 = ?',o:['fifty-seven','fifteen-seven','seventy-five','fifty-five'],a:0,s:'fifty-seven',h:'50 = fifty, 7 = seven.'},{q:'80 = ?',o:['eighteen','eighty','eight hundred','eighty-eight'],a:1,s:'eighty',h:'18 — eighteen; 80 — eighty.'}],
[{q:'200 = ?',o:['two hundreds','two hundred','twenty hundred','two thousand'],a:1,s:'two hundred',h:'С числом: two hundred, без -s.'},{q:'1,000 = ?',o:['one hundred','ten hundred','one thousand','one thousands'],a:2,s:'one thousand',h:'1000 = one thousand.'},{q:'2,300 = ?',o:['two thousand three hundred','two hundred three thousand','twenty-three','three thousand two hundred'],a:0,s:'two thousand three hundred',h:'2 тысячи + 3 сотни.'},{q:'345 = ?',o:['three forty-five','three hundred and forty-five','thirty-four five','three thousand forty-five'],a:1,s:'three hundred and forty-five',h:'3 сотни + 45 = three hundred and forty-five.'}],
[{q:'✏️✏️✏️ Как правильно?',o:['three pencil','three pencils','thirteen pencil','three pencil case'],a:1,s:'three pencils',h:'После three прибавляем -s: pencils.'},{q:'📚📚📚📚📚 Как правильно?',o:['five book','fifteen books','five books','five notebook'],a:2,s:'five books',h:'5 книг = five books.'},{q:'How many rulers? 📏📏',o:['two ruler','twelve rulers','two rulers','twenty ruler'],a:2,s:'two rulers',h:'2 линейки = two rulers.'}],
[{q:'Как сказать «школьный рюкзак»?',o:['pencil case','school bag','desk','notebook'],a:1,s:'school bag',h:'School bag — школьная сумка или рюкзак.'},{q:'30 = ?',o:['thirteen','thirty','three hundred','thirty-three'],a:1,s:'thirty',h:'30 — thirty, 13 — thirteen.'},{q:'Как назвать 1,200?',o:['one thousand two hundred','one hundred twenty','twelve','two thousand one hundred'],a:0,s:'one thousand two hundred',h:'1000 + 200.'},{q:'Как сказать «десять ручек»?',o:['ten pen','ten pencils','ten pens','ten books'],a:2,s:'ten pens',h:'Ручка — pen; 10 ручек — ten pens.'}]
];
let step=0,teacher=true,score=0,answers={},earned={},revealed={},finished=new Set();
function speak(t){if(!('speechSynthesis' in window)){alert('В этом браузере озвучка недоступна.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.83;let vs=speechSynthesis.getVoices();let v=vs.find(v=>v.lang==='en-GB')||vs.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function nav(){let n=$('tabs');n.innerHTML=sets.map((s,i)=>`<button class="tab ${i===step?'active':''} ${finished.has(i)?'done':''}" data-tab="${i}"><i>${s.icon}</i>${s.title}</button>`).join('');$('progress').style.width=((finished.size/6)*100)+'%';$('progressLabel').textContent=`Миссия ${step+1} из 6`;$('scoreLabel').textContent=`⭐ ${score} баллов`}
function questions(){return `<div class="practice-box"><div class="h3">🎮 Проверь себя</div><p style="color:#7a7192;font-weight:800">Выбирай правильный вариант. Если ошиблась, попробуй снова — баллы не теряются!</p>${q[step].map((z,i)=>{let id=step+'-'+i,ans=answers[id];return `<div class="question"><div class="qtop"><small>Вопрос ${i+1} из ${q[step].length}</small><button class="outline" data-say="${z.s}">🔊 Послушать</button></div><div class="prompt">${z.q}</div><div class="options">${z.o.map((v,j)=>`<button class="option ${ans===j?(j===z.a?'correct':'wrong'):''} ${ans!==undefined&&j===z.a?'correct':''}" data-answer="${i}:${j}" ${ans===z.a?'disabled':''}>${escapeHtml(v)}</button>`).join('')}</div><div class="feedback ${ans===undefined?'':ans===z.a?'ok':'no'}">${ans===undefined?'':ans===z.a?'✅ Молодец! +10 ⭐':'💗 Пока не совсем. Попробуй ещё раз.'}</div>${ans!==undefined&&ans!==z.a?`<button class="outline" data-hint="${i}">💡 Подсказка</button>`:''}${revealed[id]?`<div class="answer">${z.h}</div>`:''}</div>`}).join('')}</div>`}
function render(){nav();let s=sets[step];$('panel').innerHTML=`<div class="heading"><div class="bubble">${s.icon}</div><div><div class="kicker">Миссия ${step+1} · ${s.min}</div><h2>${s.title}</h2></div></div><div class="desc">${s.intro}</div><div class="columns"><div>${s.content()}${questions()}${finished.has(step)?'<div class="callout mint">🌟 Все ответы в миссии верные!</div>':''}<div class="controls"><button class="outline" id="prev" ${step===0?'disabled':''}>← Назад</button><button class="btn" id="next">${step===5?'🏆 Завершить урок':'Следующая миссия →'}</button></div>${step===5&&finished.has(5)?`<div class="end" style="margin-top:20px"><h3>Excellent, Elina! 🌈</h3><p>Ты набрала <b>${score}</b> из 210 баллов.</p><button class="btn" id="copy">📋 Скопировать результат</button></div>`:''}</div><aside class="teacher ${teacher?'':'hidden'}"><h3>👩‍🏫 Для преподавателя</h3>${s.teacher}<div class="callout lilac" style="font-size:12px"><b>Важно:</b> проверяйте не только клики, но и устные ответы. На заданиях можно задерживаться столько, сколько нужно.</div></aside></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say){speak(b.dataset.say);return}if(b.dataset.tab!==undefined){step=+b.dataset.tab;render();return}if(b.dataset.answer){let [i,j]=b.dataset.answer.split(':').map(Number),key=step+'-'+i,z=q[step][i];if(answers[key]===z.a)return;answers[key]=j;if(j===z.a&&!earned[key]){earned[key]=true;score+=10;}if(q[step].every((z,i)=>answers[step+'-'+i]===z.a))finished.add(step);render();return}if(b.dataset.hint!==undefined){revealed[step+'-'+b.dataset.hint]=true;render();return}if(b.id==='next'){if(step===5){if(q[5].every((z,i)=>answers['5-'+i]===z.a))finished.add(5);render()}else{step++;render();scrollTo({top:200,behavior:'smooth'})}}else if(b.id==='prev'&&step>0){step--;render();scrollTo({top:200,behavior:'smooth'})}else if(b.id==='teacherBtn'){teacher=!teacher;b.textContent='👩‍🏫 Подсказки учителю: '+(teacher?'ВКЛ':'ВЫКЛ');render()}else if(b.id==='resetBtn'){if(confirm('Сбросить все ответы и начать сначала?')){step=0;score=0;answers={};earned={};revealed={};finished.clear();render()}}else if(b.id==='copy'){let t=`Элина — School & Numbers Adventure. Результат: ${score}/210, миссий: ${finished.size}/6. Темы: школьные принадлежности, числа до тысяч, one/many.`;navigator.clipboard?.writeText(t).then(()=>b.textContent='✅ Скопировано').catch(()=>prompt('Скопируйте:',t))}});render();
</script></body></html>
