let step=0,teacher=true,results={},attempts={},hints={},selected={},expanded={},done=new Set(),focusId=null;const key=i=>`${step}:${i}`;const clean=s=>String(s).toLowerCase().trim().replace(/[\s\-]+/g,' ').replace(/[,\.]/g,'');
function say(s){if(!('speechSynthesis' in window)){alert('Озвучка в этом браузере не поддерживается');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.78;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang==='en-GB')||vs.find(x=>x.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function score(){return Object.values(results).filter(Boolean).length}function progress(){let max=tasks.flat().length;$('stars').textContent=`⭐ ${score()} / ${max}`;$('progressLabel').textContent=`Миссия ${step+1} из 8`;$('completed').textContent=`${done.size} / 8 ✓`;$('progressBar').style.width=`${done.size/8*100}%`;$('nav').innerHTML=missions.map((m,i)=>`<button class="navbutton ${i===step?'active':''} ${done.has(i)?'done':''}" data-nav="${i}"><span class="num">${m.emoji}</span>${i+1}. ${m.name}${done.has(i)?' ✓':''}</button>`).join('')}
function cardGallery(){return `<h3 class="mini-title">🎨 Нажимай и повторяй</h3><div class="gallery">${words.map(([emoji,w,ru],i)=>`<button class="tile ${expanded[i]?'open':''}" data-word="${i}"><span>${emoji}</span><b>${w}</b><small>${expanded[i]?`<span class="translation">${ru}</span>`:'🔊 Послушать'}</small></button>`).join('')}</div>`}
function numberGallery(arr){return `<h3 class="mini-title">🔊 Числовая лаборатория</h3><div class="numbercards">${arr.map(([n,w])=>`<button class="numbercard" data-say="${w}">${n.toLocaleString('en-US')}<small>🔊 Слушать</small></button>`).join('')}</div>`}
function taskHtml(t,i){let k=key(i),passed=!!results[k],a=attempts[k]||0,alert=passed?'✅ Отлично! +1 ⭐':a?'🌷 Пока не совсем. Попробуй снова.':'',v=hints[k]?`<div class="note yellow" style="padding:11px 14px;font-size:13px">💡 ${esc(t.hint||'Посмотри на объяснение выше и попробуй ещё раз.')}</div>`:'';let top=`<div class="activity" id="question-${i}"><div class="activity-header"><b>${t.type==='choice'?'🎯 Выбери ответ':t.type==='write'?'✏️ Напиши слово':'🧱 Собери по порядку'}</b><span>${i+1} / ${tasks[step].length} ${passed?'⭐':''}</span></div><div class="prompt">${t.prompt}</div>${t.say?`<button class="outline" data-say="${esc(t.say)}">🔊 Послушать</button>`:''}`;if(t.type==='choice'){top+=`<div class="choices" style="margin-top:14px">${t.opts.map((o,j)=>`<button class="choice ${passed&&j===t.correct?'correct':''}" data-choice="${i}:${j}" ${passed?'disabled':''}>${esc(o)}</button>`).join('')}</div>`}else if(t.type==='write'){top+=`<input class="wordinput" id="input-${i}" aria-label="Ответ на задание ${i+1}" placeholder="Напиши по-английски…" autocomplete="off" ${passed?'disabled':''}><div class="answerbar"><button class="btn" data-check="${i}" ${passed?'disabled':''}>Проверить ✓</button><button class="outline" data-hint="${i}">💡 Подсказка</button></div>`}else{let picked=selected[k]||[];top+=`<div class="assembled">${picked.length?picked.map((x,j)=>`<button class="token selected" data-remove="${i}:${j}">${esc(x)} ×</button>`).join(''):'Нажимай на части числа в правильном порядке…'}</div><div class="tokens">${t.tokens.map((x,j)=>`<button class="token" data-token="${i}:${j}" ${passed||picked.filter(y=>y===x).length>=t.tokens.filter(y=>y===x).length?'disabled':''}>${esc(x)}</button>`).join('')}</div><div class="answerbar"><button class="btn" data-check="${i}" ${passed?'disabled':''}>Проверить ✓</button><button class="outline" data-clear="${i}" ${passed?'disabled':''}>Очистить ↺</button><button class="outline" data-hint="${i}">💡 Подсказка</button></div>`}return top+`<div class="feedback ${passed?'good':''}" aria-live="polite">${alert}</div>${v}</div>`}
function render(){progress();let m=missions[step];let complete=tasks[step].every((t,i)=>results[key(i)]);if(complete&&!done.has(step)){done.add(step);progress();confetti()}let content=`<div class="section-head"><div class="bigicon">${m.emoji}</div><div><div class="eyebrow">Миссия ${step+1} · ${m.time}</div><h2>${m.name}</h2></div></div><p class="subtitle">${m.summary}</p><div class="layout"><div class="lesson">${m.intro||'<div class="note">✨ Сначала попробуй сама, затем проверь ответ. За каждое выполненное задание получишь звезду!</div>'}${m.gallery?cardGallery():''}${m.numbers?numberGallery(m.numbers):''}<h3 class="mini-title">🎮 Твоя игровая практика</h3><div class="progressmini">${tasks[step].map((_,i)=>`<i class="${results[key(i)]?'ok':''}"></i>`).join('')}</div>${tasks[step].map((t,i)=>taskHtml(t,i)).join('')}${complete?`<div class="note mint">🌟 Миссия пройдена! Все задания выполнены. Можно идти дальше.</div>`:''}${step===7&&complete?`<div class="gameend"><div style="font-size:66px">🏆🎉🌈</div><h3>You're amazing, Elina!</h3><p>Ты прошла сказочную школу и собрала <b>${score()}</b> звёзд из ${tasks.flat().length}!</p><button class="btn" id="copyBtn">📋 Скопировать результат учителю</button></div>`:''}<div class="footer-controls"><button class="outline" data-nav="${Math.max(0,step-1)}" ${step===0?'disabled':''}>← Назад</button><button class="btn" data-nav="${Math.min(7,step+1)}" ${step===7?'disabled':''}>Дальше →</button></div></div><aside class="teach ${teacher?'':'hidden'}"><h3>👩‍🏫 Подсказки учителю</h3><ul>${m.teacher.map(x=>`<li>${x}</li>`).join('')}</ul><div class="note mint" style="padding:13px;font-size:13px">Попроси Элину <b>произнести ответ вслух</b> до нажатия. Звуки здесь специально не изучаем.</div><b>Дополнительная устная практика</b><p style="font-size:13px;line-height:1.7">${['Назови 8 вещей вокруг себя. Покажи реальный предмет и скажи слово.','Угадай предмет по описанию учителя на русском. Затем обменяйтесь ролями.','Диктуй по очереди 13, 30, 14, 40, 15, 50, 18, 80.','Собирайте числа: 20+7, 30+8, 60+4, 90+9; диктуйте друг другу.','Продиктуй 105, 240, 999, 1200, 2345, 12050.','Сыграйте в магазин: How many pens? — Five pens.','Продиктуй смешанный список слов и чисел без зрительной опоры.','Устно: 6 школьных предметов, 4 двузначных и 4 больших числа.'][step]}</p></aside></div>`;$('board').innerHTML=content;window.scrollTo({top:Math.min(window.scrollY,document.querySelector('.board').offsetTop-24),behavior:'smooth'})}
function confetti(){for(let i=0;i<22;i++){let s=document.createElement('span');s.className='confetti';s.textContent=['⭐','🎉','💜','✨'][i%4];s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(Math.random()*.6)+'s';document.body.append(s);setTimeout(()=>s.remove(),3200)}}
function mark(i,valid){let k=key(i);if(results[k])return;if(valid){results[k]=true;say('Great job!');render();let node=$('question-'+i);if(node)node.scrollIntoView({block:'center',behavior:'smooth'})}else{attempts[k]=(attempts[k]||0)+1;render();let node=$('question-'+i);if(node)node.scrollIntoView({block:'center',behavior:'smooth'})}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav!==undefined){step=Number(b.dataset.nav);render();return}if(b.dataset.say){say(b.dataset.say);return}if(b.dataset.word!==undefined){let i=Number(b.dataset.word);expanded[i]=!expanded[i];say(words[i][1]);render();return}if(b.dataset.choice){let [i,j]=b.dataset.choice.split(':').map(Number);mark(i,j===tasks[step][i].correct);return}if(b.dataset.hint!==undefined){hints[key(Number(b.dataset.hint))]=true;render();return}if(b.dataset.token){let [i,j]=b.dataset.token.split(':').map(Number),k=key(i);(selected[k]??=[]).push(tasks[step][i].tokens[j]);render();return}if(b.dataset.remove){let [i,j]=b.dataset.remove.split(':').map(Number);(selected[key(i)]||[]).splice(j,1);render();return}if(b.dataset.clear!==undefined){selected[key(Number(b.dataset.clear))]=[];render();return}if(b.dataset.check!==undefined){let i=Number(b.dataset.check),t=tasks[step][i];if(t.type==='write'){let v=$('input-'+i)?.value||'';mark(i,clean(v)===clean(t.answer))}else{mark(i,JSON.stringify(selected[key(i)]||[])===JSON.stringify(t.answer))}return}if(b.id==='teacherBtn'){teacher=!teacher;b.textContent=`👩‍🏫 Подсказки учителю: ${teacher?'ВКЛ':'ВЫКЛ'}`;render();return}if(b.id==='resetBtn'){if(confirm('Начать урок заново? Все звёзды сбросятся.')){step=0;results={};attempts={};hints={};selected={};expanded={};done=new Set();render()}return}if(b.id==='copyBtn'){let t=`Элина — School & Number Wonderland: ${score()} / ${tasks.flat().length} заданий. Пройдено ${done.size} из 8 миссий.`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>alert('Результат скопирован!')).catch(()=>prompt('Скопируйте результат:',t))}else prompt('Скопируйте результат:',t)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.wordinput')){e.preventDefault();let i=Number(e.target.id.split('-')[1]);mark(i,clean(e.target.value)===clean(tasks[step][i].answer))}});render();
</script></body></html>
