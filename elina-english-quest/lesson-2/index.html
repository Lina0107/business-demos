.mint{background:#effcf9;border-color:#b8eee2}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.wordcard{border:2px solid #ece7f7;background:#fff;border-radius:22px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;gap:7px;transition:.2s}.wordcard:hover{transform:translateY(-2px);border-color:#9e89ee}.wordcard .emoji{font-size:42px}.wordcard .word{font-family:Fredoka;font-size:26px;color:var(--deep)}.wordcard .tap{font-size:12px;color:#8880a1;font-weight:800}.quiz{border-radius:24px;background:#f8f6ff;padding:24px;margin:23px 0 14px;border:1px solid #eae4ff}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.qnum{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:900;color:var(--purple)}.qprompt{font:600 25px/1.25 Fredoka;margin:17px 0 16px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:2px solid #e5def7;border-radius:17px;background:#fff;padding:15px 10px;min-height:59px;font-size:20px;font-weight:900;color:var(--ink)}.choice:hover:not(:disabled){border-color:#937ee4;background:#faf7ff}.choice.good{border-color:#44bda6;background:#e8fff9}.choice.bad{border-color:#ef8caa;background:#fff0f4}.feedback{font-weight:900;min-height:31px;padding-top:10px;font-size:15px}.feedback.ok{color:#149279}.feedback.no{color:#d95784}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.primary{background:var(--purple);border:0;color:white;border-radius:16px;padding:14px 21px;font-weight:900;box-shadow:0 8px 15px #7058d82d}.primary:hover{background:var(--deep)}.secondary{background:#fff;border:1.5px solid #d9cffa;color:var(--deep);border-radius:16px;padding:13px 18px;font-weight:900}.navbottom{display:flex;justify-content:space-between;gap:15px;margin-top:26px}.phonics-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.sound{background:#fff;border:2px solid #ece7f7;border-radius:18px;min-height:110px;padding:11px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.sound b{font:600 42px Fredoka;color:var(--deep)}.sound small{font-size:12px;color:#827797;font-weight:900}.sound:hover{border-color:#a78deb}.blend{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin:18px 0}.tile{display:grid;place-items:center;min-width:70px;height:75px;border:2px solid #d7c8f6;border-radius:19px;background:white;font:600 36px Fredoka;color:var(--deep)}.tile.vowel{background:#ffeaf2;border-color:#f6b7cf;color:#bd4385}.tile.multi{background:#e9fff8;border-color:#8bdbca;color:#238774}.arrow{font-size:29px;color:#9886c5}.readbox{background:linear-gradient(120deg,#fff8f0,#fff0fa);border-radius:24px;padding:24px;margin:17px 0}.readline{font:600 clamp(21px,3vw,29px) Fredoka;line-height:1.8}.readline span{display:inline-block;background:#fff;padding:2px 11px;border-radius:12px;margin:4px 6px 4px 0;cursor:pointer;border:1px solid #fae0ec}.readline span:hover{background:#f9e7ff}.numbers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.numcard{border:2px solid #e8e1f7;border-radius:18px;padding:15px 5px;background:#fff;font:600 24px Fredoka;color:var(--purple)}.numcard small{display:block;font:800 12px Nunito;color:#8a82a0;margin-top:3px}.finish{background:linear-gradient(135deg,#fbecff,#e7f9fa);padding:30px;border-radius:25px;text-align:center}.finish h3{font:600 35px Fredoka;margin:10px}.hidden{display:none!important}.stars{font-size:58px}.footer{margin:25px auto 0;text-align:center;color:#978cae;font-size:12px}.tiny{font-size:12px;color:#928aa4;font-weight:800}.answerbox{border:1px dashed #cfbee9;background:white;padding:12px 16px;border-radius:14px;margin-top:12px;font-size:14px;display:none}.answerbox.show{display:block}.badge{background:#ffebf3;color:#9e4777;border-radius:12px;padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}.speak{background:#fff;border:1.5px solid #e0d7f9;border-radius:13px;padding:9px 12px;color:var(--purple);font-weight:900}.speak:hover{background:#f1ecff}@media(max-width:850px){.lesson-grid{grid-template-columns:1fr}.teacher{order:2}.nav{grid-template-columns:repeat(3,1fr)}.heroart{font-size:70px}.hero{padding:30px}}@media(max-width:530px){.app{padding:12px 11px 60px}.hero{padding:24px;min-height:215px}.heroart{display:none}.top{align-items:start}.brand{font-size:20px}.panel{padding:17px}.nav{gap:7px}.tab{min-height:78px;font-size:11px;padding:9px 3px}.tab .em{font-size:23px}.cards{grid-template-columns:repeat(2,1fr)}.phonics-grid{grid-template-columns:repeat(3,1fr)}.numbers{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}.qprompt{font-size:23px}.quiz{padding:17px}.pill{padding:9px 11px}.tile{min-width:56px;height:62px;font-size:29px}}
</style></head><body><div class="app"><header class="top"><div class="brand">✦ <span>Elina's</span> English Studio</div><div class="tools"><button class="smallbtn" id="teacherToggle">👩‍🏫 Подсказки учителю: ВКЛ</button><button class="smallbtn" id="resetBtn">↺ Сначала</button></div></header>
<section class="hero"><div><div class="eyebrow">Lesson 02 · 60 minutes · Repeat & read</div><h1>Sound & School Adventure ✨</h1><p>Повторим школьные слова и большие числа, научимся слышать звуки и читать слова увереннее.</p></div><div class="heroart">📚🦄</div></section>
<div class="status"><div class="pill">⭐ Баллы: <span id="score">0</span></div><div class="pill">🎯 Миссия: <span id="stepLabel">1/6</span></div><div class="progress" aria-label="Прогресс"><div id="bar"></div></div><div class="pill">⏱ 60 минут</div></div><nav id="tabs" class="nav" aria-label="Разделы урока"></nav><main class="panel" id="panel"></main><div class="footer">Слушай → повторяй → читай сама → проверяй. Для занятий с преподавателем.</div></div>
<script>
const steps=[{icon:'🎒',short:'Школа',title:'School Bag Rescue',min:'10 минут',intro:'Повторяем слова для школы. Сначала слушаем, потом читаем.'},{icon:'🔢',short:'Числа',title:'Number Galaxy',min:'10 минут',intro:'Считаем от маленьких чисел до тысяч.'},{icon:'🔤',short:'Гласные',title:'Sound Laboratory',min:'12 минут',intro:'Учимся слышать пять коротких гласных звуков в простых словах.'},{icon:'🚂',short:'SH / CH',title:'Sound Twins',min:'10 минут',intro:'Две буквы вместе дают один звук: sh и ch.'},{icon:'📖',short:'Чтение',title:'Reading Garden',min:'10 минут',intro:'Соединяем звуки, читаем слова и короткие предложения.'},{icon:'🏆',short:'Финал',title:'Star Challenge',min:'8 минут',intro:'Закрепляем всё, что повторили сегодня.'}];
const school=[['📘','book','книга'],['✏️','pencil','карандаш'],['🖊️','pen','ручка'],['📏','ruler','линейка'],['🎒','bag','сумка / рюкзак'],['📓','notebook','тетрадь'],['🧽','rubber','ластик (брит.)'],['🪑','chair','стул'],['🖥️','computer','компьютер']];
const nums=[['13','thirteen'],['30','thirty'],['40','forty'],['100','one hundred'],['115','one hundred and fifteen'],['250','two hundred and fifty'],['1000','one thousand'],['2300','two thousand three hundred']];
const quizzes=[
[{q:'Найди слово «линейка».',opts:['ruler','rubber','pencil','book'],a:0,say:'ruler',help:'ruler = линейка, rubber = ластик.'},{q:'Что изображено? 🎒',opts:['chair','bag','book','pen'],a:1,say:'bag',help:'bag — сумка или рюкзак.'},{q:'Выбери английское слово «тетрадь».',opts:['notebook','pencil','rubber','computer'],a:0,say:'notebook',help:'note + book = notebook.'}],
[{q:'Как пишется 40 словами?',opts:['fourty','forty','fourteen','four'],a:1,say:'forty',help:'forty — без буквы u. Не fourty.'},{q:'Какое число: two hundred and fifty?',opts:['205','250','215','2500'],a:1,say:'two hundred and fifty',help:'two hundred = 200, fifty = 50.'},{q:'Как сказать 2 300?',opts:['two hundred three','two thousand three hundred','two thousand thirty','three thousand two hundred'],a:1,say:'two thousand three hundred',help:'two thousand = 2000, three hundred = 300.'}],
[{q:'В каком слове слышим короткий /æ/ как в cat?',opts:['pen','sun','bag','sit'],a:2,say:'bag',help:'bag = /bæɡ/. Открой рот шире для /æ/.'},{q:'В каком слове короткий /ɪ/ как в sit?',opts:['pin','pen','cat','cup'],a:0,say:'pin',help:'pin /pɪn/ и pen /pen/ звучат по-разному.'},{q:'В каком слове короткий /ʌ/ как в cup?',opts:['dog','sun','bed','big'],a:1,say:'sun',help:'sun /sʌn/.'}],
[{q:'В каком слове слышим /ʃ/ — sh?',opts:['chip','ship','chin','chair'],a:1,say:'ship',help:'sh = /ʃ/ — долгий шипящий звук.'},{q:'Как читается ch в слове chair?',opts:['/ʃ/ (ш)','/tʃ/ (ч)','/k/ (к)','/s/ (с)'],a:1,say:'chair',help:'В chair две буквы ch дают /tʃ/.'},{q:'Вставь буквы: __op (магазин)',opts:['sh','ch','th','ph'],a:0,say:'shop',help:'shop = sh + op, произносим /ʃɒp/ (брит.) или /ʃɑːp/ (амер.).'}],
[{q:'Прочитай: She has a red pen. Что у неё есть?',opts:['Красная ручка','Синяя книга','Две тетради','Жёлтая линейка'],a:0,say:'She has a red pen.',help:'She has = у неё есть, a red pen = красная ручка.'},{q:'Прочитай: The bag is on the chair. Где сумка?',opts:['Под столом','В школе','На стуле','В коробке'],a:2,say:'The bag is on the chair.',help:'on the chair = на стуле.'},{q:'В слове ship сколько звуков?',opts:['4','3','2','5'],a:1,say:'ship',help:'sh /ʃ/ + i /ɪ/ + p /p/ = 3 звука.'}],
[{q:'Что означает «notebook»?',opts:['Линейка','Тетрадь','Сумка','Ластик'],a:1,say:'notebook',help:'notebook = тетрадь.'},{q:'Назови число: 115',opts:['one hundred and fifty','one hundred and fifteen','one thousand fifteen','fifteen hundred'],a:1,say:'one hundred and fifteen',help:'115 = one hundred and fifteen (британский вариант). В американском and часто опускают.'},{q:'Какие две буквы слышим в начале слова «ship»?',opts:['ch','sh','th','ck'],a:1,say:'ship',help:'sh = /ʃ/.'},{q:'В каком слове короткий звук /e/?',opts:['bed','big','bag','bug'],a:0,say:'bed',help:'bed /bed/ (в некоторых словарях /bɛd/).'}]
];
let step=0,score=0,teacher=true,answers={},finished=new Set(),answered={},reveals={};const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function speak(s,rate=.81){if(!('speechSynthesis' in window)){alert('Озвучивание недоступно в этом браузере.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=rate;u.pitch=1.04;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function btnSay(t,label='🔊 Послушать'){return `<button class="speak" data-say="${esc(t)}">${label}</button>`}
function drawNav(){$('tabs').innerHTML=steps.map((s,i)=>`<button class="tab ${i===step?'active':''} ${finished.has(i)?'done':''}" data-step="${i}"><span class="em">${s.icon}</span>${s.short}</button>`).join('');$('stepLabel').textContent=(step+1)+'/6';$('score').textContent=score;$('bar').style.width=(finished.size/6*100)+'%'}
const teacherNotes=[`<b>Цель:</b> проверить узнавание школьных слов и чтение, не требуя письма на память.<ul><li>Сначала попросите Элину назвать предмет по картинке.</li><li>Нажмите на карточку для образца произношения, затем попросите прочитать слово.</li><li>Отметьте слова, которые путает: например, <b>ruler / rubber</b>.</li></ul>Переход к тесту — только после устной репетиции.`,`<b>Цель:</b> повторить десятки, сотни и тысячи.<ul><li>Разведите <b>thirteen / thirty</b> (ударение и окончание).</li><li><b>forty</b>, не <s>fourty</s>.</li><li>100 = one hundred; 200 = two hundred (без -s); 1 000 = one thousand.</li><li>В британском варианте 115: one hundred <b>and</b> fifteen; в американском and часто опускают.</li></ul>Сначала считайте вместе, потом ученица сама.`,`<b>Цель:</b> учиться соединять звуки, а не запоминать название буквы.<ul><li>Короткий a /æ/: <b>cat, bag</b>; e /e/: <b>pen, bed</b>; i /ɪ/: <b>sit, pin</b>; o /ɒ/ (брит.): <b>dog, hot</b>; u /ʌ/: <b>sun, cup</b>.</li><li>Не переводите звук русской буквой как полное совпадение: произношение различается.</li><li>Медленно: /p/ — /e/ — /n/ → pen. Не «пи-и-ни».</li></ul>Если тяжело, закрепите только a/e/i и вернитесь к o/u позже.`,`<b>Цель:</b> показать, что две буквы могут обозначать один звук.<ul><li><b>sh</b> = /ʃ/ (как в ship, shop, fish).</li><li><b>ch</b> = /tʃ/ (как в chip, chin, chair).</li><li>Контраст <b>ship / chip</b> особенно полезен для слуха.</li><li>Это основные варианты в данных словах, но не универсальное правило для всех английских слов: например, school содержит ch со звуком /k/.</li></ul>Попросите выделить звук голосом, затем прочитать слово целиком.`,`<b>Цель:</b> выйти от отдельного слова к смыслу предложения.<ul><li>Сначала Элина читает сама. Не поправляйте каждую букву мгновенно.</li><li>Разберите новые связки <b>she has</b> = у неё есть; <b>on the chair</b> = на стуле.</li><li>Подсветите смысл артикля <b>a</b> перед одним предметом, но не делайте отдельный урок грамматики.</li></ul>Если чтение ещё медленное, прочитайте первое предложение совместно.`,`<b>Итог:</b> проведите задания без подсказок, затем вернитесь к ошибкам.<ul><li>Попросите прочитать 3 слова: <b>bag, pen, ship</b>.</li><li>Продиктуйте 2 числа: <b>40</b> и <b>2300</b>.</li><li>Спросите, какой звук дают <b>sh</b> и <b>ch</b> в изученных словах.</li></ul>Не оценивайте тему как усвоенную только по выбору правильного варианта: проверьте чтение вслух.`];
function cards(){return `<div class="labelrow"><div class="lesson-title">🎒 Что лежит в школьном рюкзаке?</div><span class="hint">Нажми на карточку</span></div><div class="cards">${school.map(([e,w])=>`<button class="wordcard" data-say="${w}"><span class="emoji">${e}</span><span class="word">${w}</span><span class="tap">🔊 Слушать и повторять</span></button>`).join('')}</div><div class="callout purple"><b>Читаем вместе:</b> pen · bag · book · ruler · notebook.<br><b>Найди и скажи:</b> Show me a pencil! / Show me a book!</div>`}
function numberSection(){return `<div class="callout"><b>Вспомни правило:</b> 13 — thirteen, но 30 — thirty. 40 — <b>forty</b> (не fourty).<br>200 — <b>two hundred</b>, 2000 — <b>two thousand</b> (без окончания -s).</div><div class="labelrow"><div class="lesson-title">🚀 Нажми число и повтори</div><span class="hint">Числа до тысяч</span></div><div class="numbers">${nums.map(([n,w])=>`<button class="numcard" data-say="${w}">${n}<small>🔊 Нажми</small></button>`).join('')}</div><div class="callout mint"><b>Устно с учителем:</b> 14 → 40 → 140 → 400 → 1400. Назови сначала число, потом послушай себя и проверь.</div>`}
function vowelSection(){return `<div class="callout purple"><b>Секрет чтения:</b> название буквы и её звук в слове — не одно и то же. Сейчас тренируем <b>короткие гласные</b> в простых словах. Не добавляй к согласным лишнее «ы»!</div><div class="phonics-grid">${[['a','cat','/æ/'],['e','pen','/e/'],['i','sit','/ɪ/'],['o','dog','/ɒ/'],['u','sun','/ʌ/']].map(([c,w,ipa])=>`<button class="sound" data-say="${w}"><b>${c}</b><small>${esc(ipa)} · ${w}</small>🔊</button>`).join('')}</div><div class="labelrow"><div class="lesson-title">🧩 Складываем звуки</div></div><div class="blend"><div class="tile">p</div><span class="arrow">+</span><div class="tile vowel">e</div><span class="arrow">+</span><div class="tile">n</div><span class="arrow">→</span><button class="primary" data-say="pen">pen 🔊</button></div><div class="callout"><b>Как тренировать:</b> сначала /p/ → /e/ → /n/ отдельно, затем плавно слей в <b>pen</b>. Точно так же: c-a-t → cat, s-i-t → sit, s-u-n → sun. <b>Важно:</b> буква c в cat звучит /k/.</div><div class="readline">${['cat','bed','pin','dog','cup','bag'].map(w=>`<span data-say="${w}">${w} 🔊</span>`).join('')}</div><div class="tiny">Звук o в dog дан в британском произношении /ɒ/; американское звучание может отличаться.</div>`}
function digraphSection(){return `<div class="callout purple"><b>Новое правило:</b> иногда <b>две буквы дают один звук</b>. В наших словах <b>sh</b> читается /ʃ/ («ш» приблизительно), а <b>ch</b> читается /tʃ/ («ч» приблизительно).</div><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="wordcard" data-say="ship"><span class="emoji">🚢</span><span class="word"><span style="color:#de6a9c">sh</span>ip</span><span class="tap">sh → /ʃ/ · ship</span></button><button class="wordcard" data-say="chip"><span class="emoji">🍟</span><span class="word"><span style="color:#de6a9c">ch</span>ip</span><span class="tap">ch → /tʃ/ · chip</span></button><button class="wordcard" data-say="fish"><span class="emoji">🐟</span><span class="word">fi<span style="color:#de6a9c">sh</span></span><span class="tap">fish</span></button><button class="wordcard" data-say="chair"><span class="emoji">🪑</span><span class="word"><span style="color:#de6a9c">ch</span>air</span><span class="tap">chair</span></button></div><div class="callout mint"><b>Слушай и различай:</b> ${btnSay('ship','🔊 ship')} ${btnSay('chip','🔊 chip')}<br>Спроси: «Какое слово начинается с /ʃ/? А какое с /tʃ/?»</div><div class="readline">${['shop','fish','ship','chip','chin','chair'].map(w=>`<span data-say="${w}">${w} 🔊</span>`).join('')}</div><div class="tiny">Другие сочетания ch могут читаться иначе (например, school). Сегодня закрепляем именно sh и ch в словах выше.</div>`}
function readSection(){return `<div class="callout">Читаем в 3 шага: <b>1.</b> найди знакомые слова → <b>2.</b> прочитай предложение сама → <b>3.</b> нажми на озвучку для проверки.</div><div class="readbox"><div class="readline">1. She has a red pen.</div>${btnSay('She has a red pen.')}<div class="tiny">she has — у неё есть · red — красный</div></div><div class="readbox"><div class="readline">2. The bag is on the chair.</div>${btnSay('The bag is on the chair.')}<div class="tiny">on the chair — на стуле</div></div><div class="readbox"><div class="readline">3. I have a book and a pencil.</div>${btnSay('I have a book and a pencil.')}<div class="tiny">I have — у меня есть · and — и</div></div><div class="labelrow"><span class="lesson-title">🔎 Найди слово со звуком /ʃ/</span></div><div class="readline"><span data-say="ship">ship 🔊</span><span data-say="pen">pen 🔊</span><span data-say="chair">chair 🔊</span></div>`}
function finalSection(){return `<div class="finish"><div class="stars">🏆✨</div><h3>Финальная звёздная миссия!</h3><p>Теперь попробуй ответить без помощи учителя. После этого прочитай три слова вслух.</p><div class="badge">Школа + числа + звуки + чтение</div></div>`}
function quizView(){let qs=quizzes[step];return `<div class="labelrow"><span class="lesson-title">🎮 Проверь себя</span><span class="hint">${qs.length} вопроса${qs.length===4?'':' · без спешки'}</span></div>${qs.map((q,i)=>{let key=step+'-'+i,chosen=answers[key];return `<div class="quiz"><div class="qhead"><span class="qnum">Вопрос ${i+1} из ${qs.length}</span>${btnSay(q.say,'🔊 Слушать')}</div><div class="qprompt">${q.q}</div><div class="choices">${q.opts.map((o,j)=>`<button class="choice ${chosen===j?(j===q.a?'good':'bad'):''} ${chosen!==undefined&&j===q.a?'good':''}" data-answer="${i}:${j}" ${chosen===q.a?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="feedback ${chosen===undefined?'':chosen===q.a?'ok':'no'}">${chosen===undefined?'':chosen===q.a?'✅ Верно! +10 ⭐':'💗 Почти! Попробуй ещё раз.'}</div>${chosen!==undefined&&chosen!==q.a?`<button class="secondary" data-help="${i}">💡 Подсказка</button>`:''}<div class="answerbox ${reveals[key]?'show':''}">${q.help}</div></div>`}).join('')}`}
function render(){drawNav();const s=steps[step];let main=[cards,numberSection,vowelSection,digraphSection,readSection,finalSection][step]();$('panel').innerHTML=`<div class="section-head"><div class="circle">${s.icon}</div><div><div class="kicker">Миссия ${step+1} · ${s.min}</div><h2>${s.title}</h2></div></div><div class="sub">${s.intro}</div><div class="lesson-grid"><div class="practice">${main}${quizView()}${finished.has(step)?`<div class="callout mint"><b>🌟 Миссия пройдена!</b> Продолжай исследовать английский.</div>`:''}<div class="navbottom"><button class="secondary" id="prev" ${step===0?'disabled':''}>← Назад</button><button class="primary" id="next">${step===5?'✨ Завершить урок':'Следующая миссия →'}</button></div></div><aside class="teacher ${teacher?'':'hidden'}"><h3>👩‍🏫 Учителю</h3>${teacherNotes[step]}<div class="callout purple"><b>Контроль устно:</b> правильный выбор ответа ещё не гарантирует, что Элина может прочитать слово самостоятельно.</div><div class="tiny">Время примерное: темп адаптируйте под ребёнка.</div></aside></div>${step===5&&finished.has(5)?`<div class="finish" style="margin-top:24px"><div class="stars">🌟🌟🌟</div><h3>Great job, Elina!</h3><p>Ты закончила все миссии! Баллы: <b>${score}</b>. Учитель может вернуться к любым сложным заданиям.</p><button class="primary" id="copyResult">📋 Скопировать результат</button></div>`:''}`;}
function checkStepComplete(){let qs=quizzes[step];if(qs.every((q,i)=>answers[step+'-'+i]===q.a)){finished.add(step);render();}}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-say]');if(!b)return;if(b.dataset.say){speak(b.dataset.say);return}if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();return}if(b.dataset.answer){let [i,j]=b.dataset.answer.split(':').map(Number),key=step+'-'+i,q=quizzes[step][i];if(answers[key]===q.a)return;answers[key]=j;if(j===q.a&&!answered[key]){score+=10;answered[key]=true;}checkStepComplete();render();return}if(b.dataset.help!==undefined){reveals[step+'-'+b.dataset.help]=true;render();return}if(b.id==='prev'&&step>0){step--;render();window.scrollTo({top:170,behavior:'smooth'})}if(b.id==='next'){if(step===5){finished.add(5);render();window.scrollTo({top:450,behavior:'smooth'})}else{step++;render();window.scrollTo({top:170,behavior:'smooth'})}}if(b.id==='teacherToggle'){teacher=!teacher;$('teacherToggle').textContent='👩‍🏫 Подсказки учителю: '+(teacher?'ВКЛ':'ВЫКЛ');render()}if(b.id==='resetBtn'){if(confirm('Начать урок заново? Все баллы сбросятся.')){step=0;score=0;answers={};answered={};reveals={};finished.clear();render()}}if(b.id==='copyResult'){let t=`Элина — Sound & School Adventure. Баллы: ${score} / 190. Пройдено миссий: ${finished.size}/6. Темы: школьные слова, числа, короткие гласные, sh/ch, чтение.`;navigator.clipboard?.writeText(t).then(()=>{b.textContent='✅ Скопировано'}).catch(()=>prompt('Скопируйте результат:',t))}});
render();
</script></body></html>
